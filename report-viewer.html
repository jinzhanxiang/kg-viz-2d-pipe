<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研报详情 - KG Wiki</title>
<style>
:root {
  --bg: #0d0d1a; --bg2: #141428; --bg3: #1a1a32;
  --fg: #e8e8f0; --fg2: #9898b0; --fg3: #6868a0;
  --accent: #5DADE2; --gold: #F5B041; --green: #58D68D;
  --red: #EC7063; --purple: #A29BFE;
  --border: rgba(255,255,255,0.06);
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --radius: 10px;
  font-family: 'FangSong','仿宋','STFangsong','Microsoft YaHei','PingFang SC',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-size:17px;line-height:1.7;min-height:100vh}
#hdr{position:sticky;top:0;z-index:100;background:rgba(13,13,26,.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:14px}
#hdr .back{color:var(--fg2);text-decoration:none;font-size:20px;padding:6px 12px;border-radius:8px;
  background:rgba(255,255,255,.05);transition:background .2s}
#hdr .back:hover{background:rgba(255,255,255,.15);color:#fff}
#hdr .t{flex:1;font-size:15px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cnt{max-width:1100px;margin:0 auto;padding:28px 24px 80px}

/* Report header */
.rh{display:flex;align-items:flex-start;gap:20px;margin-bottom:24px;padding:24px 28px;
  background:linear-gradient(135deg,var(--bg2) 0%,#0d0d1a 100%);
  border:1px solid var(--border);border-radius:var(--radius);position:relative;overflow:hidden}
.rh::before{content:'';position:absolute;top:-80px;right:-80px;width:200px;height:200px;
  background:radial-gradient(circle,rgba(93,173,226,.08) 0%,transparent 70%);pointer-events:none}
.rh .icon{font-size:42px;flex-shrink:0;width:56px;text-align:center}
.rh .info{flex:1}
.rh h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.4}
.rh .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--fg2);margin-bottom:10px}
.rh .meta span{display:flex;align-items:center;gap:4px}
.rh .badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600}
.badge-source{background:rgba(93,173,226,.15);color:var(--accent)}
.badge-pass{background:rgba(88,214,141,.15);color:var(--green)}
.badge-fail{background:rgba(236,112,99,.15);color:var(--red)}
.badge-industry{background:rgba(245,176,65,.15);color:var(--gold)}

.rh .btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.rh .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;
  font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;border:none}
.btn-pdf{background:linear-gradient(135deg,#E74C3C,#C0392B);color:#fff}
.btn-pdf:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(231,76,60,.4)}
.btn-copy{background:rgba(255,255,255,.08);color:var(--fg)}
.btn-copy:hover{background:rgba(255,255,255,.15);color:#fff}

/* Summary card */
.sc{padding:16px 20px;margin-bottom:20px;background:rgba(93,173,226,.04);
  border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;font-size:15px;line-height:1.8;color:var(--fg)}

/* Section */
.sec{margin-bottom:24px}
.sec-h{font-size:18px;font-weight:700;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-h .cnt{font-size:12px;font-weight:400;color:var(--fg3);background:rgba(255,255,255,.06);
  padding:0 8px;border-radius:8px;font-family:monospace}

/* Entity grid */
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ec{padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  font-size:14px;cursor:pointer;transition:all .15s}
.ec:hover{background:var(--bg3);border-color:var(--accent);transform:translateY(-1px)}
.ec .en{color:#fff;font-weight:600}
.ec .et{font-size:11px;color:var(--fg3);margin-top:2px}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--bg2);border-radius:var(--radius);overflow:hidden}
.tbl th{background:var(--bg3);color:var(--fg2);font-size:12px;font-weight:600;text-transform:uppercase;
  padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--fg)}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl .v{color:var(--gold);font-weight:700;font-family:monospace;font-size:15px;text-align:center}
.tbl .e{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* Logic */
.lc{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;
  margin-bottom:6px;font-size:14px;line-height:1.6}
/* Logic card — P228 replaced with .lgrid/.lchdr/.lbody layout; old .lc .lt/.lp/.lc2/.lcf removed to avoid specificity override */

/* Indicator table P228 enhancement */

/* Framework card (P228) */
.fgrid{display:grid;grid-template-columns:1fr;gap:14px}
.fc{padding:14px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);border-left:3px solid var(--purple);transition:all .2s}
.fc:hover{background:var(--bg3);border-color:var(--purple)}
.fch{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.fctype{font-size:10px;font-weight:600;color:#fff;background:rgba(162,155,254,.2);padding:2px 10px;border-radius:10px;letter-spacing:.5px}
.fcname{font-size:16px;font-weight:700;color:#fff}
.fmeta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.fm{font-size:12px;color:var(--fg2);background:rgba(255,255,255,.04);padding:3px 10px;border-radius:6px;display:flex;align-items:center;gap:4px}
.fm b{color:var(--fg3);font-weight:400;font-size:11px}
.fsc{font-size:12px;color:var(--accent);background:rgba(93,173,226,.08);padding:3px 10px;border-radius:6px;display:flex;align-items:center;gap:4px}
.fsc b{color:var(--accent);font-weight:400;font-size:11px}
.fstep-title{font-size:13px;font-weight:600;color:var(--gold);margin:8px 0 4px;display:flex;align-items:center;gap:4px}
.fsteps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.fsteps > div{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--fg2);padding:6px 10px;background:rgba(245,176,65,.04);border-radius:6px;line-height:1.5}
.fsnum{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#111;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fcont{font-size:12px;color:var(--fg2);margin-top:8px;padding:8px 12px;background:rgba(255,255,255,.02);border-radius:6px;line-height:1.7}
.fcont b{color:var(--fg3);font-weight:400;font-size:11px}

/* Logic chain card (P228) */
.lgrid{display:grid;grid-template-columns:1fr;gap:12px}
.lc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;border-left:3px solid var(--purple);transition:all .2s}
.lc:hover{background:var(--bg3);border-color:var(--gold)}
.lchdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.lctype{font-size:10px;font-weight:600;color:var(--purple);background:rgba(162,155,254,.15);padding:2px 10px;border-radius:10px}
.lctext{flex:1;font-size:14px;color:var(--fg);font-weight:600;line-height:1.5}
.lconf{flex-shrink:0;font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px}
.lbody{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lp{padding:8px 12px;background:rgba(93,173,226,.06);border-radius:6px;font-size:12px;line-height:1.6;color:var(--fg2);display:flex;gap:6px;align-items:flex-start}
.lp b{color:var(--accent);font-weight:600;font-size:11px;flex-shrink:0;white-space:nowrap}
.lc2{padding:8px 12px;background:rgba(88,214,141,.06);border-radius:6px;font-size:12px;line-height:1.6;color:var(--fg2);display:flex;gap:6px;align-items:flex-start}
.lc2 b{color:var(--green);font-weight:600;font-size:11px;flex-shrink:0;white-space:nowrap}

@media (max-width:640px){
  .lbody{grid-template-columns:1fr}
}

/* Relation */
.rc{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);
  border:1px solid var(--border);border-radius:8px;margin-bottom:4px;font-size:14px}
.rc .rf{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rc .rt{color:var(--gold);font-size:12px;padding:2px 8px;background:rgba(245,176,65,.1);border-radius:4px}
.rc .rto{color:var(--green);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

#loading{text-align:center;padding:80px 0;color:var(--fg2)}
#loading .spinner{font-size:40px;animation:spin 1s linear infinite;margin-bottom:12px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#error{text-align:center;padding:80px 0;color:var(--red);display:none}
</style>
</head>
<body>
<div id="hdr">
  <a class="back" href="javascript:history.back()">←</a>
  <span class="t">研报详情</span>
  <a class="back" href="kg_entity_relation.html" style="font-size:13px">图谱</a>
</div>
<div id="cnt">
  <div id="loading"><div class="spinner">⏳</div><div>加载研报数据...</div></div>
  <div id="error">⚠️ 研报未找到</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const reportId = params.get('report_id');
const rptTitle = params.get('title') || '';

if (!reportId) {
  document.getElementById('error').style.display = 'block';
  document.getElementById('error').textContent = '缺少 report_id 参数';
} else {
  loadReport(reportId);
}

function loadReport(id) {
  const apiUrl = `http://localhost:19001/report/${id}`;
  // Also try from the tunnel URL for external access
  fetch(apiUrl)
    .then(r => r.json())
    .then(d => {
      if (d.error) throw new Error(d.error);
      renderReport(d);
    })
    .catch(err => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = `加载失败: ${err.message}`;
    });
}

function openEntity(name) {
  // P228: 跳转回主图谱（index.html），URL 参数 entity=name 自动定位并高亮该节点
  window.open(`index.html?entity=${encodeURIComponent(name)}`, '_blank');
}

function renderReport(r) {
  document.getElementById('loading').style.display = 'none';
  const cnt = document.getElementById('cnt');
  cnt.innerHTML = '';

  // PDF path
  const pdfName = r.pdf_path ? r.pdf_path.split('/').pop() : '';
  const pdfUrl = r.pdf_path ? `http://localhost:19001/pdf/${encodeURIComponent(r.pdf_path)}` : '';
  const tunnelUrl = localStorage.getItem('wiki_tunnel_url') || '';

  // ─── Report Header ───
  const qualityBadge = r.quality_passed
    ? '<span class="badge badge-pass">✅ 质量通过</span>'
    : '<span class="badge badge-fail">❌ 质量未通过</span>';
  const scoreBadge = r.quality_score
    ? `<span class="badge badge-industry">评分 ${r.quality_score.toFixed(1)}</span>` : '';

  let headerHTML = `
    <div class="rh">
      <div class="icon">📄</div>
      <div class="info">
        <h1>${escHtml(r.title)}</h1>
        <div class="meta">
          <span>📅 ${r.publish_date || '未知'}</span>
          <span>🏢 ${r.industry || '未知行业'}</span>
          <span>📰 ${r.source || '未知来源'}</span>
          <span class="badge badge-source">${r.type || '研报'}</span>
          ${qualityBadge} ${scoreBadge}
        </div>
        <div class="btns">
          <a class="btn btn-pdf" href="${escHtml(pdfUrl || '#')}" target="_blank" download>
            📥 下载PDF原文
          </a>
          <button class="btn btn-copy" onclick="copyPdfPath()">📋 复制路径</button>
        </div>
      </div>
    </div>`;
  cnt.innerHTML += headerHTML;

  // Store PDF path for copy function
  window._pdfPath = r.pdf_path || '';

  // ─── Summary / Core Conclusion ───
  if (r.summary || r.core_conclusion) {
    cnt.innerHTML += `<div class="sc">${escHtml(r.summary || r.core_conclusion)}</div>`;
  }

  // ─── Keywords ───
  if (r.keywords) {
    cnt.innerHTML += `<div class="sec"><div class="sec-h">🏷️ 关键词</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${
        r.keywords.split(/[,，、\s]+/).filter(Boolean).map(k =>
          `<span style="padding:4px 12px;background:var(--bg2);border:1px solid var(--border);
            border-radius:14px;font-size:13px;color:var(--fg2)">${escHtml(k.trim())}</span>`
        ).join('')
      }</div></div>`;
  }

  // ─── Frameworks (P228 重构) ─── 完整卡片：场景/维度/步骤/内容
  if (r.frameworks && r.frameworks.length > 0) {
    let fGrid = '';
    r.frameworks.forEach(f => {
      let dims = '';
      try {
        const d = JSON.parse(f.dimensions);
        if (Array.isArray(d)) dims = d.join(' · ');
      } catch(e) { dims = f.dimensions || ''; }
      let stepsHtml = '';
      try {
        const s = JSON.parse(f.steps);
        if (Array.isArray(s) && s.length > 0) {
          stepsHtml = '<div class="fsteps">' + s.map((x, i) =>
            `<span class="fsnum">${i+1}</span><span>${escHtml(x)}</span>`
          ).join('') + '</div>';
        }
      } catch(e) {}
      fGrid += `<div class="fc">
        <div class="fch">
          <span class="fctype">${escHtml(f.type || '')}</span>
          <span class="fcname">${escHtml(f.name)}</span>
        </div>
        <div class="fmeta">
          ${f.category ? `<span class="fm"><b>分类</b>${escHtml(f.category)}</span>` : ''}
          ${f.apply_industry ? `<span class="fm"><b>行业</b>${escHtml(f.apply_industry)}</span>` : ''}
          ${f.apply_scenario ? `<span class="fsc"><b>场景</b>${escHtml(f.apply_scenario)}</span>` : ''}
          ${dims ? `<span class="fm"><b>维度</b>${escHtml(dims)}</span>` : ''}
        </div>
        ${stepsHtml ? `<div class="fstep-title">📍 分析步骤</div>${stepsHtml}` : ''}
        ${f.content ? `<div class="fcont"><b>内容</b>${escHtml(f.content)}</div>` : ''}
      </div>`;
    });
    cnt.innerHTML += `<div class="sec"><div class="sec-h">📐 研究框架 <span class="cnt">${r.frameworks.length}</span></div><div class="fgrid">${fGrid}</div></div>`;
  }

  // ─── Entities ───
  if (r.entities && r.entities.length > 0) {
    let egHTML = '';
    r.entities.forEach(e => {
      const typeBadge = {'ORG':'🏢','PERSON':'👤','PRODUCT':'📦','TECH':'💡','INDUSTRY':'🏭','POLICY':'📋','PLACE':'📍'}
      egHTML += `<div class="ec" onclick="openEntity('${escHtml(e.name)}')"><div class="en">${typeBadge[e.type]||'📌'} ${escHtml(e.name)}</div><div class="et">${escHtml(e.type)} · ${escHtml(e.industry || '')}</div></div>`;
    });
    cnt.innerHTML += `<div class="sec"><div class="sec-h">🏛️ 实体提取 <span class="cnt">${r.entities.length}</span></div><div class="eg">${egHTML}</div></div>`;
  }

  // ─── Indicators ───
  if (r.indicators && r.indicators.length > 0) {
    let tblHTML = '<table class="tbl"><tr><th>指标</th><th>数值</th><th>单位</th><th>关联实体</th></tr>';
    r.indicators.forEach(ind => {
      tblHTML += `<tr><td>${escHtml(ind.name)}</td><td class="v">${escHtml(ind.value)}</td><td>${escHtml(ind.unit || '')}</td><td>${ind.entity ? `<span class="e" onclick="openEntity('${escHtml(ind.entity)}')">${escHtml(ind.entity)}</span>` : ''}</td></tr>`;
    });
    tblHTML += '</table>';
    cnt.innerHTML += `<div class="sec"><div class="sec-h">📈 指标 <span class="cnt">${r.indicators.length}</span></div>${tblHTML}</div>`;
  }

  // ─── Logic Chains (P228 重构) ─── 三段式展开：摘要+前提→结论+置信度徽章
  if (r.logic_chains && r.logic_chains.length > 0) {
    let lcGrid = '';
    r.logic_chains.forEach(lc => {
      const conf = lc.confidence ? (lc.confidence * 100).toFixed(0) : null;
      const dimMap = {1:'宏观',2:'行业',3:'公司',4:'技术',5:'政策',6:'财务'};
      lcGrid += `<div class="lc">
        <div class="lchdr">
          <span class="lctype">${escHtml(dimMap[lc.dimension] || lc.dimension || '分析')}</span>
          <span class="lctext">${escHtml(lc.text || '')}</span>
          ${conf ? `<span class="lconf" style="background:${conf>=80?'rgba(88,214,141,.15)':'rgba(245,176,65,.15)'};color:${conf>=80?'var(--green)':'var(--gold)'}">🎯 ${conf}%</span>` : ''}
        </div>
        <div class="lbody">
          ${lc.premise ? `<div class="lp"><b>🔹 前提</b><span>${escHtml(lc.premise)}</span></div>` : ''}
          ${lc.conclusion ? `<div class="lc2"><b>🔺 结论</b><span>${escHtml(lc.conclusion)}</span></div>` : ''}
        </div>
      </div>`;
    });
    cnt.innerHTML += `<div class="sec"><div class="sec-h">🧠 逻辑链 <span class="cnt">${r.logic_chains.length}</span></div><div class="lgrid">${lcGrid}</div></div>`;
  }

  // ─── Relations ───
  if (r.relations && r.relations.length > 0) {
    let rcHTML = '';
    r.relations.forEach(rel => {
      rcHTML += `<div class="rc"><span class="rf" onclick="openEntity('${escHtml(rel.from)}')">${escHtml(rel.from)}</span><span style="color:var(--fg3);font-size:12px">${rel.type === '供应' ? '→' : rel.type === '竞争' ? '⚔️' : rel.type === '合作' ? '🤝' : '⟷'}</span><span class="rt">${escHtml(rel.type)}</span><span style="color:var(--fg3);font-size:12px">⟷</span><span class="rto" onclick="openEntity('${escHtml(rel.to)}')">${escHtml(rel.to)}</span></div>${rel.desc ? `<div class="rcdesc">${escHtml(rel.desc)}</div>` : ''}`;
    });
    cnt.innerHTML += `<div class="sec"><div class="sec-h">🔗 实体关系 <span class="cnt">${r.relations.length}</span></div><div class="rclist">${rcHTML}</div></div>`;
  }
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyPdfPath() {
  navigator.clipboard.writeText(window._pdfPath).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✅ 已复制';
    setTimeout(() => btn.textContent = '📋 复制路径', 2000);
  });
}
</script>
</body>
</html>
