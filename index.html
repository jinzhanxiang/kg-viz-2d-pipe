<script>
  const TYPE_COLORS = {

  const TYPE_SHAPES = {
    'INDUSTRY': 'hexagon',   // 行业 - 六边形

    'PERSON': 'circle',      // 人物 - 圆形
    'PRODUCT': 'parallelogram', // 产品 - 平行四边形

    'INDICATOR': 'ellipse',  // 指标 - 椭圆形

  // 方向 2: 边类型样式映射（按 edge.type 分配颜色 + 箭头）

  const EDGE_STYLES = {

    '投资': { color: 'rgba(255,220,80,1)', width: 1.8, arrow: 'full', label: '投资' },

    '战略联盟': { color: 'rgba(180,180,255,1)', width: 1.5, arrow: 'arrow', label: '战略联盟' },

  const EDGE_DEFAULT = { color: 'rgba(220,220,240,0.7)', width: 0.8, arrow: 'none', label: '关系' };

  const TYPE_SIZE = {
    INDUSTRY: 8, ORG: 5, PRODUCT: 4, TECH: 4, POLICY: 4,

  };

  let rawData = null;
  let graphData = null;
  let Graph = null;
  let currentFocus = null;
  let currentTypeFocus = null;
  let selectedNode = null;

  // P229 v6 (2026-07-31): 根本性架构修复 — industry-based enrichment 懒加载
  // 废弃 enrichment_top.json（单文件 54MB），改用行业分桶文件（industries/*.json，~1-2MB/个）
  // 前端：点击节点 → 查 entity_industry_index.json → 加载对应行业文件 → 提取 enrichment → 缓存
  let entityIndustryIndex = null;
  let industryFileCache = {};  // industry_name → [entities with enrichment]
  let indexLoading = false;
  let indexLoaded = false;

  // P229 v6: 加载 entity_industry_index.json（entity_id → industry_name，~50KB）
  async function loadIndustryIndex() {
    if (indexLoading || indexLoaded) return;
    indexLoading = true;
    try {
      const cb = '?v=' + Date.now();
      const res = await fetch('./entity_industry_index.json' + cb, { cache: 'no-store' });
      if (res.ok) {
        entityIndustryIndex = await res.json();
        indexLoaded = true;
        console.log('[P229 v6] entity_industry_index.json 已加载:', Object.keys(entityIndustryIndex).length, '条');
      }
    } catch (e) {
      console.warn('[P229 v6] index 加载失败:', e.message);
    } finally {
      indexLoading = false;
    }
  }

  // P229 v6: 懒加载行业文件 + 提取 enrichment
  async function loadIndustryFile(industry) {
    if (!industry) return null;
    if (industryFileCache[industry]) return industryFileCache[industry];
    try {
      const cb = '?v=' + Date.now();
      const res = await fetch(`./industries/${industry}.json` + cb, { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        industryFileCache[industry] = data;  // 缓存完整行业数据
        console.log(`[P229 v6] 行业文件 ${industry}.json 已加载: ${data.length} 实体`);
        return data;
      }
    } catch (e) {
      console.warn(`[P229 v6] 行业文件 ${industry}.json 加载失败:`, e.message);
    }
    return null;
  }

  // P229 v6: 为 node 注入 enrichment 数据（从 industry 文件提取）
  async function attachEnrichment(node) {
    const eid = node.id;
    if (!eid) return;
    // 等待索引加载完成
    if (!indexLoaded) await loadIndustryIndex();
    if (!entityIndustryIndex) return;
    const industry = entityIndustryIndex[eid];
    if (!industry) return;
    // 加载行业文件（缓存）
    const industryData = await loadIndustryFile(industry);
    if (!industryData) return;
    // 从行业文件中找到该实体的 enrichment
    const enriched = industryData.find(e => e.id === eid);
    if (!enriched) return;
    node._logicRefs = enriched._logicRefs || [];
    node._indicators = enriched._indicators || [];
    node._frameworks = enriched._frameworks || [];
    node._reports = enriched._reports || [];
    // relatedEntities: 从 graphData.links 推导
    if (!node._relatedEntities || node._relatedEntities.length === 0) {
      const related = [];
      graphData.links.forEach(l => {
        const src = typeof l.source === 'object' ? l.source.id : l.source;
        const tgt = typeof l.target === 'object' ? l.target.id : l.target;
        if (src === eid && tgt !== eid) {
          const t = graphData.nodes.find(n => n.id === tgt);
          if (t) related.push({ id: t.id, name: t.name, type: t.typeLabel || t.type, relations: [l.type || '相关'], relation_count: 1 });
        } else if (tgt === eid && src !== eid) {
          const t = graphData.nodes.find(n => n.id === src);
          if (t) related.push({ id: t.id, name: t.name, type: t.typeLabel || t.type, relations: [l.type || '相关'], relation_count: 1 });
        }
      });
      node._relatedEntities = related;
    }
  }

      transformData();
      initGraph();
      initControls();
      initLegend();
      updateStats();
      document.getElementById('loader').classList.add('hidden');
    } catch (err) {
      console.error('[V5] 数据加载失败:', err);
      document.getElementById('loader').innerHTML = '❌ 数据加载失败: ' + err.message + '<br><small>请刷新页面重试</small>';
    }
  }

  // ===========================
  // 2. 转换为 force-graph 格式
  // ===========================
  function transformData() {
    // v15: 补全 importance / publishDate + 实时计算 degree
    const nodes = rawData.entities.map(e => ({
      id: e.id,
      name: e.name,
      type: e.type,
      industry: e.industry,
      color: e.color || TYPE_COLORS[e.type] || '#888',
      typeLabel: e.typeLabel || e.type,
      desc: e.desc || '',
      val: TYPE_SIZE[e.type] || 4,
      sector: e.sector || '',
      subIndustry: e.subIndustry || '',
      core: e.core || false,
      importance: e.importance || 0,  // v15 数据补全
      publishDate: e.publishDate || '',  // v15 数据补全
      degree: 0,  // v15 数据补全（下面实时计算）
      _logicRefs: e._logicRefs || [],  // v43 R1+ : 真实逻辑链（D1 抽取的 premise/conclusion/reasoning）
      _indicators: e._indicators || [],  // v44 P0-1 : 关联指标（enrich_v44 PG attach）
      _frameworks: e._frameworks || [],  // v44 P0-2 : 研究框架（6 大维度）
      _relatedEntities: e._relatedEntities || [],  // v44 P0-3 : 关联实体（含 description）
      _reports: e._reports || [],  // P221 (2026-07-28): 原始研报数据（report_id + title）
      document.getElementById('detailTitle').innerHTML = `<span style="color:${typeColor}">${escapeHtml(node.name || node.id)}</span>`;
      document.getElementById('detailSubtitle').textContent = `${node.typeLabel || node.type} · 形状: ${shapeLabel}`;
      
      // 基本信息
      const _imp3 = node.importance || 0;
      const importanceLabel = _imp3 === 3 ? '⭐⭐⭐ 核心' : _imp3 === 2 ? '⭐⭐ 重要' : _imp3 === 1 ? '⭐ 普通' : '⚪ 边缘';
      document.getElementById('detailBasic').innerHTML = `
        <div><span class="label">ID:</span><span class="value">${escapeHtml(node.id)}</span></div>
        <div><span class="label">类型:</span><span class="value">${escapeHtml(node.typeLabel || node.type || 'N/A')}</span></div>
        <div><span class="label">行业:</span><span class="value">${escapeHtml(node.industry || '未分类')}</span></div>
        <div><span class="label">子行业:</span><span class="value">${escapeHtml(node.subIndustry || '未分类')}</span></div>
        <div><span class="label">度数:</span><span class="value">${node.degree || 0}</span></div>
        <div><span class="label">重要性:</span><span class="value">${importanceLabel}</span></div>
        <div><span class="label">时间:</span><span class="value">${escapeHtml(node.publishDate || '未知')}</span></div>
        <div><span class="label">社区:</span><span class="value">#${(node._communityId !== undefined ? node._communityId : (node.communityId !== undefined ? node.communityId : '未分配'))}</span></div>
        ${node.desc ? `<div><span class="label">描述:</span><span class="value">${escapeHtml(node.desc.slice(0, 200))}</span></div>` : ''}
      `;
      
      // v34: 删除邻居节点维度（主公要求：与下方关联指标重复）
      // 保留可视化逻辑但不渲染 DOM（避免与下方出现重复）
      const neighbors = [];
      const neighborEdges = new Map();
      graphData.links.forEach(l => {
        const src = typeof l.source === 'object' ? l.source.id : l.source;
        const tgt = typeof l.target === 'object' ? l.target.id : l.target;
        if (src === node.id) {
          if (!neighborEdges.has(tgt)) neighborEdges.set(tgt, []);
          neighborEdges.get(tgt).push({type: l.type, weight: l.weight, dir: 'in'});
          if (!neighbors.find(n => n.id === tgt)) neighbors.push(graphData.nodes.find(nn => nn.id === tgt));
        } else if (tgt === node.id) {
          if (!neighborEdges.has(src)) neighborEdges.set(src, []);
          neighborEdges.get(src).push({type: l.type, weight: l.weight, dir: 'out'});
          if (!neighbors.find(n => n.id === src)) neighbors.push(graphData.nodes.find(nn => nn.id === src));
        }
      });
      // v34: 不再填充 detailNeighborCount/detailNeighbors DOM（v34 已从 HTML 中删除容器）

      // R1 主公选项：从 knowledge_logic 表查询的真实逻辑链（替换 v34 buildLogicContentV34 假逻辑）
      // 数据源：data.json 中每个 entity 的 _logicRefs 字段（含 premise/conclusion/reasoning/dimension）
      function buildRealLogicContent(n) {
        const ctx = [];
        const logicRefs = n._logicRefs || [];

        if (logicRefs.length === 0) {
          // 无真实逻辑关联的节点：明确告知，避免假逻辑
          ctx.push({ stage: '说明', text: `该节点暂无来自知识图谱的真实逻辑链记录（仅基础描述与关系）。` });
          return ctx;
        }

        // 优先取 is_core=true 的逻辑链（最多 3 条）
        const coreLogics = logicRefs.filter(l => l.is_core).slice(0, 3);
        const displayLogics = coreLogics.length > 0 ? coreLogics : logicRefs.slice(0, 2);

        displayLogics.forEach((logic, idx) => {
          // 真实逻辑链：前提 → 推理 → 结论
          if (logic.premise) {
            ctx.push({
              stage: '前提',
              text: logic.premise.length > 200 ? logic.premise.slice(0, 200) + '...' : logic.premise,
              logicType: logic.logic_type,
              confidence: logic.confidence
            });
          }
          if (logic.intermediate) {
            ctx.push({
              stage: '推理',
              text: logic.intermediate.length > 150 ? logic.intermediate.slice(0, 150) + '...' : logic.intermediate
            });
          }
          if (logic.conclusion) {
            ctx.push({
              stage: '结论',
              text: logic.conclusion.length > 200 ? logic.conclusion.slice(0, 200) + '...' : logic.conclusion
            });
          }
          // 应用场景作为补充
          if (logic.apply_scenario) {
            ctx.push({
              stage: '场景',
              text: logic.apply_scenario
            });
          }
        });

        // 统计信息
        ctx.push({
          stage: '统计',
          text: `该节点共有 ${logicRefs.length} 条逻辑链记录（${displayLogics.length} 条已展开）`
        });

        return ctx;
      }
      // 逻辑链/框架渲染已合并到下方 v58 独立卡片（L2427-2470）
      // L2148-2151 旧调用删除：buildRealLogicContent 仅在 detailLogic 渲染时用一次

// v34: 按关系类别展示（重构 v33 5 维度）— 主公要求：竞争/对比/上下游/客户/产品/技术/供应/战略联盟
      // 实测：边 type 18 种（对比766/供应606/上下游566/监管487/合作397/竞争364/客户237/投资149/战略联盟133/技术链70...）
      // 上下游 vs 客户 vs 供应 是独立类型，不重复
      // 产品/技术 — 边无 type，产品用 n.type='PRODUCT'、技术用 n.type='TECH'
      // 逻辑 — 去掉描述 v33（之主公反馈“逻辑=公司简介”），改为从出边构建逻辑论述

      // 1. 按关系类别分组（从出边出发）
      const relationGroups = {
        '对比': [],
        '供应': [],
        '上下游': [],
        '竞争': [],
        '合作': [],
        '客户': [],
        '战略联盟': [],
        '投资': [],
        '监管': []
      };
      // 产品/技术 — 按节点 type 收集邻居中的 PRODUCT/TECH
      const productRelations = [];
      const techRelations = [];

      graphData.links.forEach(l => {
        const sId = typeof l.source === 'object' ? l.source.id : l.source;
        const tId = typeof l.target === 'object' ? l.target.id : l.target;
        if (sId !== node.id && tId !== node.id) return;
        const otherId = sId === node.id ? tId : sId;
        const other = graphData.nodes.find(nn => nn.id === otherId);
        if (!other) return;
        const t = l.type || '未标注';

        // 主公列出的 9 个关系类别（加上“合作”扩展）
        if (relationGroups[t]) {
          relationGroups[t].push({ node: other, edgeType: t, dir: sId === node.id ? 'out' : 'in' });
        }
        // 产品/技术 — 从邻居节点 type 收集
        if (other.type === 'PRODUCT') productRelations.push({ node: other, edgeType: t, dir: sId === node.id ? 'out' : 'in' });
        if (other.type === 'TECH') techRelations.push({ node: other, edgeType: t, dir: sId === node.id ? 'out' : 'in' });
      });

      // ── 去重：双向关系合并（如 英伟达→AMD 竞争 + AMD→英伟达 竞争 → 英伟达↔AMD 竞争）──
      Object.keys(relationGroups).forEach(key => {
        const list = relationGroups[key];
        const merged = [];
        const seen = new Map(); // neighborId → entry
        list.forEach(item => {
          const nid = item.node.id;
          if (seen.has(nid)) {
            const existing = seen.get(nid);
            // 已有记录，标记为双向
            if (existing.dir !== item.dir) {
              existing.dir = 'both';
            }
          } else {
            seen.set(nid, { ...item });
          }
        });
        relationGroups[key] = Array.from(seen.values());
      });
      // ── 去重2：PRODUCT/TECH 节点已在"产品/技术"分类展示，从其他分类移除 ──
      const productTechIds = new Set();
      productRelations.forEach(item => productTechIds.add(item.node.id));
      techRelations.forEach(item => productTechIds.add(item.node.id));
      Object.keys(relationGroups).forEach(key => {
        if (key === '产品' || key === '技术') return;
        relationGroups[key] = relationGroups[key].filter(item => !productTechIds.has(item.node.id));
      });

          const nc = TYPE_COLORS[n.type] || '#888';
          const edgeTypeLabel = item.edgeType && item.edgeType !== groupKey ? `<span style="color:#666;font-size:11px;"> [${escapeHtml(item.edgeType)}]</span>` : '';
          html.push(`<div class="detail-relation-item" data-id="${escapeHtml(n.id)}" style="font-size:13px;color:#ccc;line-height:1.8;padding:5px 10px;cursor:pointer;border-left:3px solid ${color};margin:3px 0;border-radius:4px;background:rgba(255,255,255,0.02);" onmouseover="this.style.background='${color}25';this.style.paddingLeft='14px'" onmouseout="this.style.background='rgba(255,255,255,0.02)';this.style.paddingLeft='10px'">

      // P242 Fix (2026-08-12): 删除 "📡 关联节点（按关系类别）" 渲染

// v33: 来源（填充真实可用的信息）— 报告来源：底 + 时间 + 社区 + 邻居样本报告

      // P221 (2026-07-28): 原始研报 — 从 node._reports 渲染可点击链接到 report-viewer

        reports.slice(0, 8).forEach(rp => {

      // 合并 + 输出

      // ===== v58 逻辑链（替换 v34 假逻辑）=====
      try {

    // ===========================
    // 方向 6: 关系类型图例（右侧）
    // ===========================
    function buildEdgeTypeLegend() {
      // 统计每种关系类型的数量
      const typeCount = {};
      graphData.links.forEach(l => {
        const t = l.type || '相关';
        typeCount[t] = (typeCount[t] || 0) + 1;
      });
      const sorted = Object.entries(typeCount).sort((a, b) => b[1] - a[1]);
      
      // v53: 开局默认只勾选【对比、供应、上下游】3 个关系，其他全部不选
      // 全局选中状态：window.__edgeTypeFilter = Set
      if (!window.__edgeTypeFilter) {
        window.__edgeTypeFilter = new Set();
        sorted.forEach(([type, count]) => {
          if (['对比', '供应', '上下游'].includes(type)) {
            window.__edgeTypeFilter.add(type);
          }
        });
      }
      
      const html = ['<div style="margin-top:12px;padding-top:8px;border-top:1px solid #333"><h4 style="color:#FFD700;margin:0 0 8px 0;font-size:12px">🔗 关系类型（多选）</h4>'];
      // 全选/全不选按钮
      html.push('<div style="margin-bottom:6px;display:flex;gap:4px"><button id="edgeAllOn" style="flex:1;font-size:10px;padding:2px 4px;background:#222;color:#4ec9ff;border:1px solid #4ec9ff;border-radius:3px;cursor:pointer">全选</button><button id="edgeAllOff" style="flex:1;font-size:10px;padding:2px 4px;background:#222;color:#FFA07A;border:1px solid #FFA07A;border-radius:3px;cursor:pointer">全不选</button></div>');
      sorted.forEach(([type, count]) => {
        const style = EDGE_STYLES[type] || EDGE_DEFAULT;
        const arrow = style.arrow === 'full' ? '→' : style.arrow === 'arrow' ? '→' : '·';
        const isDashed = style.dash ? 'dashed' : 'solid';
        const isChecked = window.__edgeTypeFilter.has(type);
        html.push(`<label class="edge-legend-item" data-type="${type}" style="display:flex;align-items:center;gap:6px;padding:3px 6px;cursor:pointer;font-size:12px;color:#ccc;opacity:${isChecked ? 1 : 0.4}">
          <input type="checkbox" class="edge-type-cb" data-type="${type}" ${isChecked ? 'checked' : ''} style="cursor:pointer;accent-color:#4ec9ff">
          <span style="display:inline-block;width:24px;height:0;border-top:2px ${isDashed} ${style.color}">${arrow}</span>
          <span style="flex:1">${type}</span>
          <span style="color:#888;font-size:11px;">${count}</span>
        </label>`);
      });
      html.push('</div>');
      
      // 插入到 legendContent 末尾
      const legendContent = document.getElementById('legendContent');
      if (legendContent) {
        let edgeLegend = legendContent.querySelector('.edge-legend-list');
        if (edgeLegend) {
          edgeLegend.outerHTML = html.join('');
        } else {
          legendContent.insertAdjacentHTML('beforeend', '<div class="edge-legend-list">' + html.join('') + '</div>');
        }
        
        // v50: 应用边类型过滤（多选）
        function applyEdgeTypeFilter() {
          if (!window.__edgeTypeFilter) return;
          graphData.links.forEach(l => {
            const visible = window.__edgeTypeFilter.has(l.type);
            l._edgeHidden = !visible;
            l._dimmed = !visible;
          });
          // 节点 dim：所有可见边都不连接的节点 → dim
          const visibleNodes = new Set();
          graphData.links.forEach(l => {
            if (!l._edgeHidden) {
              const s = typeof l.source === 'object' ? l.source.id : l.source;
              const t = typeof l.target === 'object' ? l.target.id : l.target;
              visibleNodes.add(s);
              visibleNodes.add(t);
            }
          });
          graphData.nodes.forEach(n => {
            n._dimmed = !visibleNodes.has(n.id);
          });
          try { (Graph.refresh ? Graph.refresh() : Graph._rerender ? Graph._rerender() : null); } catch(e) {}
        }
        window.__applyEdgeTypeFilter = applyEdgeTypeFilter;
        
        // 绑定 checkbox 变化事件
        document.querySelectorAll('.edge-type-cb').forEach(cb => {
          cb.addEventListener('change', () => {
            const typeName = cb.dataset.type;
            if (cb.checked) window.__edgeTypeFilter.add(typeName);
            else window.__edgeTypeFilter.delete(typeName);
            // 更新 label 透明度
            const label = cb.closest('.edge-legend-item');
            if (label) label.style.opacity = cb.checked ? 1 : 0.4;
            applyEdgeTypeFilter();
            console.log('[v50] 边类型过滤:', typeName, cb.checked);
          });

    // 方向 6: 延迟构建关系图例（等数据稳定后）

    // 方向 A: 标记需要弧形聚合的边

    // 触发条件2: 跨多类型同节点对 → 强制弯曲（视觉上区分不同关系）
    setTimeout(() => {
      const pairCount = {};
      graphData.links.forEach(l => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        const key = [s, t].sort().join('|');
        if (!pairCount[key]) pairCount[key] = 0;
        pairCount[key]++;
      });
      graphData.links.forEach(l => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        const key = [s, t].sort().join('|');
        // ≥2 条边的节点对 → 弧形聚合（更宽容的阈值）
        l._isAggregated = pairCount[key] >= 2;
        // 计算弧形偏移量（每条边的弧度不同）
        const samePairEdges = graphData.links.filter(x => {
          const xs = typeof x.source === 'object' ? x.source.id : x.source;
          const xt = typeof x.target === 'object' ? x.target.id : x.target;
          return [xs, xt].sort().join('|') === key;
        });
        const idx = samePairEdges.indexOf(l);
        l._curveOffset = (idx - (samePairEdges.length - 1) / 2) * 0.15;
      });
      const aggregatedCount = graphData.links.filter(l => l._isAggregated).length;
      console.log('[方向 A] 弧形聚合边数:', aggregatedCount, '/', graphData.links.length);

    // ===========================

    // 方向 K: Mini-map 点击跳转（点击 mini-map → graph centerAt + zoom）
    miniMap.addEventListener('click', (e) => {
      const rect = miniMap.getBoundingClientRect();
      const mx = (e.clientX - rect.left) / rect.width;
      const my = (e.clientY - rect.top) / rect.height;
      if (!graphData?.nodes?.length) return;
      const xs = graphData.nodes.map(n => n.x || 0);
      const ys = graphData.nodes.map(n => n.y || 0);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const rangeX = Math.max(maxX - minX, 1);
      const rangeY = Math.max(maxY - minY, 1);
      const padding = 10;
      const worldX = minX + ((mx * miniMap.width - padding) / (miniMap.width - padding * 2)) * rangeX;
      const worldY = minY + ((my * miniMap.height - padding) / (miniMap.height - padding * 2)) * rangeY;
      if (window.Graph?.centerAt) {
        window.Graph.centerAt(worldX, worldY, 600);

      console.log('[方向 K] Mini-map 点击跳转:', { worldX, worldY });

    miniMap.title = '点击跳转';
    
    window.__renderMiniMap = function() {
      const ctx = miniMap.getContext('2d');
      ctx.clearRect(0, 0, miniMap.width, miniMap.height);
      // 背景
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(0, 0, miniMap.width, miniMap.height);
      
      // 计算 bbox
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      graphData.nodes.forEach(n => {
        if (n.x !== undefined) {
          minX = Math.min(minX, n.x);
          maxX = Math.max(maxX, n.x);
          minY = Math.min(minY, n.y);
          maxY = Math.max(maxY, n.y);
        }
      });
      if (minX === Infinity) return;
      const rangeX = maxX - minX || 1;
      const rangeY = maxY - minY || 1;
      const padding = 10;
      
      // 画节点（缩略点）
      graphData.nodes.forEach(n => {
        if (n.x === undefined || n._dimmed) return;
        const px = ((n.x - minX) / rangeX) * (miniMap.width - padding * 2) + padding;
        const py = ((n.y - minY) / rangeY) * (miniMap.height - padding * 2) + padding;
        const typeColor = TYPE_COLORS[n.type] || '#888';
        ctx.fillStyle = typeColor;
        ctx.beginPath();
        ctx.arc(px, py, n.importance === 3 ? 3 : 1.5, 0, Math.PI * 2);
        ctx.fill();
      });
      
      // 画视口框
      try {
        const cam = Graph.cameraPosition();
        const dist = cam.distance || 500;
        const viewportW = dist * 1.5;
        const viewportH = dist * 0.9;
        const cx = ((cam.x - minX) / rangeX) * (miniMap.width - padding * 2) + padding;
        const cy = ((cam.y - minY) / rangeY) * (miniMap.height - padding * 2) + padding;
        const vw = Math.min(viewportW / rangeX * miniMap.width, miniMap.width - padding * 2);
        const vh = Math.min(viewportH / rangeY * miniMap.height, miniMap.height - padding * 2);
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx - vw/2, cy - vh/2, vw, vh);
      } catch (e) {}
    };
    
    // 每 2 秒刷新 mini-map
    setInterval(() => {
      if (typeof window.__renderMiniMap === 'function') window.__renderMiniMap();
    }, 2000);
    console.log('[方向 E] Mini-map 已启用');
    
    // ===========================

    const aggPanel = document.createElement('div');
    aggPanel.id = 'aggPanel';
    aggPanel.style.cssText = 'position:fixed;top:80px;left:20px;background:rgba(10,10,20,0.9);border:1px solid #4ec9ff;border-radius:6px;padding:10px;font-size:12px;color:#ccc;z-index:90;min-width:180px;max-height:420px;overflow-y:auto';
    aggPanel.innerHTML = '<h4 style="color:#FFD700;margin:0 0 6px 0">📊 聚合统计</h4><div id="aggContent">加载中...</div>';
    document.body.appendChild(aggPanel);
    
    window.__renderAggPanel = function() {
      const funnel = window.__dataFunnel;
      let nodes = graphData.nodes;
      // 按当前层级过滤
      if (funnel.level === 'L0') {
        nodes = nodes.filter(n => n.industry && (n.type === 'INDUSTRY' || n.importance >= 2));
      } else if (funnel.level === 'L1' && funnel.currentIndustry) {
        nodes = nodes.filter(n => n.industry === funnel.currentIndustry);
      } else if (funnel.level === 'L2' && funnel.currentType) {
        nodes = nodes.filter(n => n.type === funnel.currentType);
      } else if (funnel.level === 'L3' && funnel.currentNode) {
        const neighborIds = new Set([funnel.currentNode]);
        graphData.links.forEach(l => {
          const s = typeof l.source === 'object' ? l.source.id : l.source;
          const t = typeof l.target === 'object' ? l.target.id : l.target;
          if (s === funnel.currentNode) neighborIds.add(t);
          if (t === funnel.currentNode) neighborIds.add(s);
        });
        nodes = nodes.filter(n => neighborIds.has(n.id));
      }
      
      // 按 type 分组
      const byType = {};
      nodes.forEach(n => {
        const t = n.typeLabel || n.type || 'UNKNOWN';
        byType[t] = (byType[t] || 0) + 1;
      });
      
      // 按行业 Top 5
      const byIndustry = {};
      nodes.forEach(n => {
        if (n.industry) byIndustry[n.industry] = (byIndustry[n.industry] || 0) + 1;
      });
      const topInd = Object.entries(byIndustry).sort((a, b) => b[1] - a[1]).slice(0, 5);
      
      // 按重要性
      const byImportance = [0, 0, 0, 0];
      nodes.forEach(n => {
        byImportance[n.importance || 0]++;
      });
      
      document.getElementById('aggContent').innerHTML = `
        <div style="margin-bottom:6px"><span style="color:#4ec9ff">层级:</span> <span style="color:#FFD700">${funnel.level}</span> · <span style="color:#fff">${nodes.length}</span> 节点</div>
        <div style="margin-bottom:4px;color:#888">按类型:</div>
        ${Object.entries(byType).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([t,c]) => 
          `<div style="padding:1px 0">${t}: <span style="color:#FFD700">${c}</span></div>`
        ).join('')}
        <div style="margin-top:6px;margin-bottom:4px;color:#888">重要性:</div>
        <div style="padding:1px 0">⭐⭐⭐ 核心: <span style="color:#FF3232">${byImportance[3]}</span></div>
        <div style="padding:1px 0">⭐⭐ 重要: <span style="color:#FFD700">${byImportance[2]}</span></div>
        <div style="padding:1px 0">⭐ 普通: <span style="color:#fff">${byImportance[1]}</span></div>
      `;
    };
    setInterval(() => {
      if (typeof window.__renderAggPanel === 'function') window.__renderAggPanel();
    }, 1500);
    console.log('[方向 F] 聚合面板已启用');
    
    // ===========================
    // 方向 G: 节点 Halo（悬停光晕）
    // ===========================
    Graph.nodeColor(node => {
      // 方向 G: hover 时高亮
      if (window.__hoverNode && window.__hoverNode.id === node.id) {
        return '#FFD700';  // 金色高亮
      }
      if (node._dimmed) return 'rgba(100,100,100,0.2)';
      return node.color;
    // 方向 R: importance 视觉编码（v15 数据补全后）—— 节点大小按 importance + degree 计算
    }).nodeVal(node => {
      if (window.__hoverNode && window.__hoverNode.id === node.id) {
        return 12;  // hover 时固定放大
      }
      if (node._dimmed) return 0.5;
      const importance = node.importance || 0;
      const degree = node.degree || 0;
      // importance 3=核心枢纽(8-12)、2=重要(5-7)、1=普通(3-4)、0=孤立(1-2)
      const base = importance === 3 ? 10 : importance === 2 ? 6 : importance === 1 ? 3.5 : 1.5;
      // 在基础上叠加 degree 缩放（最大 +3）
      const degreeBonus = Math.min(degree / 30, 3);
      return base + degreeBonus;
    });
    Graph.onNodeHover(node => {

      try { (Graph.refresh ? Graph.refresh() : Graph._rerender ? Graph._rerender() : null); } catch(e) {}
      // v23 修 Bug A：canvas 是按需查询，不是定 const，因为 canvas 可能未挂载

  // ===========================
  // P2.1: 搜索功能
  // ===========================
  let __searchHighlighted = null;
  function setupSearch() {
    const input = document.getElementById('searchInput');
    const resultsDiv = document.getElementById('searchResults');
    if (!input || !resultsDiv) return;
    
    input.addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      if (!query) {
        resultsDiv.innerHTML = '';
        resultsDiv.style.display = 'none';
        if (__searchHighlighted) {
          __searchHighlighted.forEach(n => n._searched = false);
          __searchHighlighted = null;
        }
        return;
      }
      
      const matches = graphData.nodes.filter(n => {
        return (n.name || '').toLowerCase().includes(query) ||
               (n.type || '').toLowerCase().includes(query) ||
               (n.industry || '').toLowerCase().includes(query);
      }).slice(0, 20);
      
      if (__searchHighlighted) {
        __searchHighlighted.forEach(n => n._searched = false);
      }
      matches.forEach(n => n._searched = true);
      __searchHighlighted = matches;
      
      resultsDiv.style.display = 'block';
      resultsDiv.innerHTML = matches.length === 0 
        ? '<div class="search-empty">无匹配节点</div>'
        : matches.map(n => {
          const typeColor = TYPE_COLORS[n.type] || '#888';
          return `<div class="search-item" data-id="${n.id}">
            <span style="color:${typeColor}">●</span>
            <span class="search-name">${escapeHtml(n.name || n.id)}</span>
            <span class="search-meta">${escapeHtml(n.typeLabel || n.type || '')} · ${escapeHtml(n.industry || '')}</span>
          </div>`;
        }).join('');
      
      resultsDiv.querySelectorAll('.search-item').forEach(el => {
        el.addEventListener('click', () => {
          const nodeId = el.dataset.id;
          const node = graphData.nodes.find(n => n.id === nodeId);
          if (node && Graph) {
            // 方向 7: 智能层级展开 - 根据搜索结果类型自动展开到合适层级
            // L0 → L1 → L2 → L3 → L4
            const funnel = window.__dataFunnel;
            if (funnel.level === 'L0' && node.industry) {
              funnel.level = 'L1';
              funnel.currentIndustry = node.industry;
              window.__applyDataFunnel();
            } else if (funnel.level === 'L1') {
              funnel.level = 'L2';
              funnel.currentType = node.type;
              window.__applyDataFunnel();
            }
            // L2/L3/L4 直接跳到节点详情
            funnel.level = 'L4';
            funnel.currentNode = node.id;
            window.__applyDataFunnel();
            
            // 等动画完成后定位
            setTimeout(() => {
              if (node.x !== undefined) {
                Graph.centerAt(node.x, node.y, 800);
                Graph.zoom(3, 800);
              }
              // 方向 5: 自动弹出详情卡
              if (typeof window.__showDetailCard === 'function') {
                window.__showDetailCard(node);
              }
            }, 500);
            
            input.value = '';
            resultsDiv.style.display = 'none';
            if (__searchHighlighted) {
              __searchHighlighted.forEach(n => n._searched = false);
              __searchHighlighted = null;
            }
            console.log('[方向 7] 搜索智能展开:', node.name, '→ L4 详情');
          }
        });
      });
    });
    
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        input.value = '';
        resultsDiv.style.display = 'none';
        if (__searchHighlighted) {
          __searchHighlighted.forEach(n => n._searched = false);
          __searchHighlighted = null;
        }
      }
    });
  }

  // ===========================
  // P2.3: 右键菜单
  // ===========================
  let __contextNode = null;
  function setupContextMenu() {
    const menu = document.getElementById('contextMenu');
    if (!menu || !Graph) return;
    
    Graph.onNodeRightClick(node => {
      if (!node) return;
      __contextNode = node;
      menu.style.display = 'block';
      menu.style.left = event.clientX + 'px';
      menu.style.top = event.clientY + 'px';
    });
    
    document.addEventListener('click', () => {
      menu.style.display = 'none';
    });
    
    menu.addEventListener('click', (e) => {
      const action = e.target.dataset.action;
      if (!action || !__contextNode) return;
      
      if (action === 'focus') {
        Graph.centerAt(__contextNode.x, __contextNode.y, 800);
        Graph.zoom(3, 800);
      } else if (action === 'hide') {
        __contextNode._hidden = true;
        (Graph.refresh ? Graph.refresh() : Graph._rerender ? Graph._rerender() : null);
      } else if (action === 'hideNeighbors') {
        const neighborIds = new Set([__contextNode.id]);
        graphData.links.forEach(l => {
          const src = typeof l.source === 'object' ? l.source.id : l.source;
          const tgt = typeof l.target === 'object' ? l.target.id : l.target;
          if (src === __contextNode.id) neighborIds.add(tgt);
          if (tgt === __contextNode.id) neighborIds.add(src);
        });
        graphData.nodes.forEach(n => {
          if (neighborIds.has(n.id)) n._hidden = true;
        });
        (Graph.refresh ? Graph.refresh() : Graph._rerender ? Graph._rerender() : null);
      } else if (action === 'showOnly') {
        const neighborIds = new Set([__contextNode.id]);
        graphData.links.forEach(l => {
          const src = typeof l.source === 'object' ? l.source.id : l.source;
          const tgt = typeof l.target === 'object' ? l.target.id : l.target;
          if (src === __contextNode.id) neighborIds.add(tgt);
          if (tgt === __contextNode.id) neighborIds.add(src);
        });
        graphData.nodes.forEach(n => {
          n._hidden = !neighborIds.has(n.id);
        });
        (Graph.refresh ? Graph.refresh() : Graph._rerender ? Graph._rerender() : null);
      } else if (action === 'copy') {
        navigator.clipboard.writeText(__contextNode.name || __contextNode.id);
      }
      
      menu.style.display = 'none';
    });
  }

  // ===========================
  // P3.4: hover 高亮 1-hop 邻居
  // ===========================
  let __hoveredNode = null;
  let __hoverNeighbors = new Set();
  function setupNeighborHighlight() {
    if (!Graph) return;
    
    Graph.onNodeHover(node => {
      __hoveredNode = node;
      
      __hoverNeighbors.clear();
      if (node) {
        __hoverNeighbors.add(node.id);
        graphData.links.forEach(l => {
          const src = typeof l.source === 'object' ? l.source.id : l.source;
          const tgt = typeof l.target === 'object' ? l.target.id : l.target;
          if (src === node.id) __hoverNeighbors.add(tgt);
          if (tgt === node.id) __hoverNeighbors.add(src);
        });
      }
      
      graphData.nodes.forEach(n => {
        n._highlighted = node ? __hoverNeighbors.has(n.id) : true;
        n._dimmed = node && !__hoverNeighbors.has(n.id);
      });
      
      graphData.links.forEach(l => {
        const src = typeof l.source === 'object' ? l.source.id : l.source;
        const tgt = typeof l.target === 'object' ? l.target.id : l.target;
        l._highlighted = node ? (src === node.id || tgt === node.id) : true;
      });
      
      (Graph.refresh ? Graph.refresh() : Graph._rerender ? Graph._rerender() : null);
    });
  }

  // ===========================
  // 5. 行业聚焦（V5 修复：物理过滤 graphData）
  // V4 根因诊断（16:13）：hidden=true 不重算 d3-force + zoomToFit 不动坐标
  // V5 修复：物理替换 graphData（仅该行业节点 + 仅含两端都可见的边）
  //         + 强 charge/link 让节点聚类排斥
  // ===========================
  function focusIndustry(industry) {
    if (industry === '__all__' || !industry) {
      clearFocus();
      return;
    }

    currentFocus = industry;
    console.log('[V5] 聚焦行业:', industry);

    // V6 关键修复 1/3：物理过滤节点（仅保留该行业节点）
    const visibleNodes = graphData.nodes.filter(n => n.industry === industry);
    const visibleNodeIds = new Set(visibleNodes.map(n => n.id));

    // V6 关键修复 2/3：保留所有与 visible 节点相连的边（包括跨行业）
    // 用 sourceId/targetId 记录原始 ID，但只渲染 visible 节点的边
    // 力导向只认节点，所以其他节点不显示
    // 但边保留可看到该行业与外部的连接关系
    // V12 关键修复：只保留两端都在 visibleNodes 内的边（避免 node not found 错误）
    // 之前 V11 的 OR filter 导致 1053 条边引用了不存在的节点（跨行业）
    // 改用 AND filter：只保留该行业内部的边（数量少但稳定）
    const visibleLinks = graphData.links
      .filter(l => {
        const sId = typeof l.source === 'string' ? l.source : (l.source && l.source.id);
        const tId = typeof l.target === 'string' ? l.target : (l.target && l.target.id);
        return visibleNodeIds.has(sId) && visibleNodeIds.has(tId);  // V12: 改 OR 为 AND
      })
      .map(l => {
        const sId = typeof l.source === 'string' ? l.source : (l.source && l.source.id);
        const tId = typeof l.target === 'string' ? l.target : (l.target && l.target.id);
        return {
          source: sId,
          target: tId,
          type: l.type,
          color: l.color,
          isSourceInIndustry: true,
          isTargetInIndustry: true
        };
      });
    console.log('[V12] 边过滤结果:', {
      total: graphData.links.length,
      visible: visibleLinks.length,
      bothInIndustry: visibleLinks.length
    });

    console.log('[V5] 物理过滤:', {
      nodes: visibleNodes.length,
      links: visibleLinks.length,
      sampleNodes: visibleNodes.slice(0, 3).map(n => n.name)
    });

    // V6 关键修复 3/3：环形初始位置 + 中心 cluster force
    const N = visibleNodes.length;
    const radius = Math.sqrt(N) * 35;
    visibleNodes.forEach((n, i) => {
      const angle = (i / N) * 2 * Math.PI;
      n.x = Math.cos(angle) * radius;
      n.y = Math.sin(angle) * radius;
      // V6: 临时固定位置，防止被 zoomToFit 压缩
      n.fx = n.x;
      n.fy = n.y;
    });

    console.log('[V6] 节点环形位置:', { N, radius, sampleXY: visibleNodes.slice(0, 3).map(n => ({x: n.x, y: n.y})) });

    // 核心：物理替换 graphData（仅 visible 节点 + 仅与 visible 节点相连的边）
    const newData = { nodes: visibleNodes, links: visibleLinks };
    Graph.graphData(newData);
    console.log('[V8] Graph.graphData 已重设:', { nodes: newData.nodes.length, links: newData.links.length });

    // v32: 修复 focusIndustry 三个根因（点击行业一团乱麻 + 偏离页面 + 没引力和聚类）
    // 根因 1：focusIndustry 创建新 __d3Sim 但没 forceX/Y → 行业引力聚类完全失效
    // 根因 2：环形初始位置在 (0,0) 周围，没调 Graph.centerAt(0,0) → 视图偏离出页面
    // 根因 3：1500ms 后才释放 fx/fy → 一团乱麻过渡

    // v32 修复：预设 visibleNodes 的 targetX/targetY 为该行业的环形位置（保持一致）
    const industryTargetX = 0, industryTargetY = 0;
    visibleNodes.forEach(n => {
      n.targetX = industryTargetX;
      n.targetY = industryTargetY;
    });

    // 重新设置强聚类排斥（使用 d3-force 原生配置，不调用 .strength() API）
    // V15 关键修复：完全抛弃 Graph.d3Force() API，改用独立 d3-force 3.x
    if (typeof d3 !== 'undefined' && d3.forceSimulation) {
      // 停止旧仿真
      if (window.__d3Sim) { try { window.__d3Sim.stop(); } catch(e) {} }
      // V15 + v32: 创建独立 d3-force 仿真实例（这是真正驱动节点移动的方式）
      // v32 修复：加入 forceX/Y 让行业聚类生效
      window.__d3Sim = d3.forceSimulation(visibleNodes)
        .force('charge', d3.forceManyBody().strength(-400))         // 强排斥
        .force('link', d3.forceLink(visibleLinks).id(d => d.id).distance(50))  // 连线距离
        .force('center', d3.forceCenter(0, 0).strength(0.1))       // 中心引力
        .force('collide', d3.forceCollide ? d3.forceCollide(15) : null)  // 防止重叠
        // v32: 加 forceX/Y — 行业聚类（根因 1 修复）
        .force('x', d3.forceX(0).strength(0.08))   // v32: 所有节点拉向 X=0
        .force('y', d3.forceY(0).strength(0.08))   // v32: 所有节点拉向 Y=0
        .alpha(1)                  // 立即开始
        .alphaDecay(0.05)         // v29: 0.01 → 0.05（5 倍加速衰减，~10fps 收敛）
        .velocityDecay(0.4)
        .restart();
      console.log('[V15+v32] 独立 d3-force 仿真已启动 (industry):', {
        nodes: visibleNodes.length,
        links: visibleLinks.length,
        alpha: window.__d3Sim.alpha(),
        d3_version: d3.version || 'unknown'
      });
    } else {
      console.error('[V15+v32] d3-force 3.x 未加载！请检查 CDN');
    }

    // v32 修复：立即释放 fx/fy（根因 3 修复 - 消除 1500ms 乱麻过渡）
    // 不再 setTimeout 延迟释放
    visibleNodes.forEach(n => { n.fx = null; n.fy = null; });
    Graph.graphData(newData);  // 触发 d3-force 重计算
    console.log('[V32] fx/fy 立即释放（消除 1500ms 乱麻过渡）');

    // v32 修复：调用 Graph.centerAt(0,0) 让视图居中到行业聚类中心（根因 2 修复）
    if (typeof Graph !== 'undefined' && typeof Graph.centerAt === 'function') {
      try {
        Graph.centerAt(0, 0, 600);  // 600ms 平滑动画到中心
        console.log('[V32] Graph.centerAt(0,0) 已调用 — 视图居中');
      } catch(e) {
        console.warn('[V32] Graph.centerAt 失败:', e.message);
      }
    }

    // 更新控件状态
    document.querySelectorAll('.legend-item[data-industry]').forEach(el => {
      el.classList.toggle('active', el.dataset.industry === industry);
    });
    document.querySelectorAll('.legend-item[data-type]').forEach(el => {
      el.classList.remove('active');
    });

    // v19 fix Bug 6: 切换行业时同步触发 subIndustry 二级下钻
    // v26: __updateSubIndustryPanel 已融合到 aggPanel

    if (typeof window.__renderAggPanel === 'function') window.__renderAggPanel();

    updateFocusDisplay(visibleNodes.length, visibleLinks.length);
    console.log('[V6] updateFocusDisplay 传入:', { visibleNodes: visibleNodes.length, visibleLinks: visibleLinks.length });
  }

  // B6: 类型过滤器（按 checkbox 多选结果过滤可见节点）
  function applyTypeFilter() {
    if (!window.__visibleTypes) return;
    const visibleTypes = window.__visibleTypes;
    const filteredNodes = graphData.nodes.filter(n => visibleTypes.has(n.type));
    const visibleNodeIds = new Set(filteredNodes.map(n => n.id));
    // V12: 只保留两端都在 visible 内的边
    const filteredLinks = graphData.links.filter(l => {
      const s = typeof l.source === 'string' ? l.source : (l.source && l.source.id);
      const t = typeof l.target === 'string' ? l.target : (l.target && l.target.id);
      return visibleNodeIds.has(s) && visibleNodeIds.has(t);
    });
    Graph.graphData({ nodes: filteredNodes, links: filteredLinks });

    // P243 Fix (2026-08-12): 设置 _edgeHidden 让 applyEdgeTypeFilter 能同步感知类型过滤
    // 之前：applyEdgeTypeFilter 只看关系类型，忽略实体类型过滤 → 虚空链接
    graphData.links.forEach(l => {
      const s = typeof l.source === 'string' ? l.source : (l.source && l.source.id);
      const t = typeof l.target === 'string' ? l.target : (l.target && l.target.id);
      l._edgeHidden = !(visibleNodeIds.has(s) && visibleNodeIds.has(t));
      l._dimmed = l._edgeHidden;
    });

    // B6: 应用过滤后重启 d3-force 仿真
    if (window.__d3Sim) {
      window.__d3Sim.nodes(filteredNodes);
      if (filteredLinks.length > 0) {
        window.__d3Sim.force('link').links(filteredLinks);
      }
      window.__d3Sim.alpha(0.5).restart();
    }

    updateFocusDisplay(filteredNodes.length, filteredLinks.length);
    console.log('[B6] type 过滤:', {
      visibleTypes: Array.from(visibleTypes),
      visibleNodes: filteredNodes.length,
      visibleLinks: filteredLinks.length,
      _edgeHidden: graphData.links.filter(l => l._edgeHidden).length
    });
  }

    const _origNodes = graphData.nodes;

        .velocityDecay(0.4)

      console.log('[V15] 独立 d3-force 仿真已启动 (clearFocus 全景):', {

  function focusType(type) {

      window.__d3Sim = d3.forceSimulation(visibleNodes)
        .force('charge', d3.forceManyBody().strength(-400))         // 强排斥

        .force('center', d3.forceCenter(0, 0).strength(0.1))       // 中心引力
        .force('collide', d3.forceCollide ? d3.forceCollide(15) : null)  // 防止重叠

  // ===========================
  // 6. 图例（V5 关键：仅右侧图例）
  // ===========================
  function initLegend() {
    const industries = {};
    rawData.entities.forEach(e => {
      if (e.industry) industries[e.industry] = (industries[e.industry] || 0) + 1;
    });
    const top = Object.entries(industries).sort((a, b) => b[1] - a[1]).slice(0, 12);

    const legendHtml = top.map(([ind, count]) => {
      const sample = rawData.entities.find(e => e.industry === ind && e.color);
      const color = sample ? sample.color : '#FFD700';
      return `<div class="legend-item" data-industry="${escapeHtml(ind)}" style="color:#ccc">
        <div class="legend-color" style="background:${color}"></div>
        <span>${escapeHtml(ind)} (${count})</span>
      </div>`;
    }).join('');

    // B6: type 改为 checkbox 多选（控制可见的 type 类别）
    const allTypes = Object.keys(TYPE_COLORS);
    if (!window.__visibleTypes) {
      // v30.3: 主公决策方案 A —— 默认显示 ORG（公司企业）+ INDUSTRY（行业）2 种
      // 共 1250 节点（ORG 952 + INDUSTRY 298），开局更聚焦
      // 其他 9 种类型（PRODUCT/TECH/POLICY/PERSON/PLACE/INDICATOR/RISK/CONCEPT/CHANNEL）
      // 手动点击 legend checkbox 才显示
      window.__visibleTypes = new Set(['ORG', 'INDUSTRY']);
      // v30.2: 重要修复 — 初始化后必须立即调用 applyTypeFilter() 让默认过滤生效
      // 根因：之前仅设 __visibleTypes 但未调 applyTypeFilter → graphData 仍显示全部 2420 个
      // 修复：首次设置默认可见类型后立即调一次 applyTypeFilter() 让真正过滤生效
      if (typeof applyTypeFilter === 'function') applyTypeFilter();
    }
    const typeHtml = Object.entries(TYPE_COLORS).map(([t, c]) => {
      const count = rawData.entities.filter(e => e.type === t).length;
      const checked = window.__visibleTypes.has(t) ? 'checked' : '';
      return `<label class="legend-item legend-type-checkbox" data-type="${t}" style="color:#ccc">
        <input type="checkbox" class="type-cb" data-type="${t}" ${checked}>
        <div class="legend-color" style="background:${c}"></div>
        <span>${t} (${count})</span>
      </label>`;
    }).join('');

    const html = `<h4>🏭 Top 12 行业（点击聚焦）</h4>${legendHtml}
      <h4 style="margin-top:12px">📦 实体类型（多选控制显示）</h4>
      <div style="margin-bottom:8px"><button id="selectAllTypes" style="font-size:12px;padding:2px 8px">全选</button> <button id="deselectAllTypes" style="font-size:12px;padding:2px 8px">全不选</button></div>
      ${typeHtml}`;

    document.getElementById('legendContent').innerHTML = html;

    // B6: 绑定 checkbox 事件
    document.querySelectorAll('.type-cb').forEach(cb => {
      cb.addEventListener('change', () => {
        const t = cb.dataset.type;
        if (cb.checked) {
          window.__visibleTypes.add(t);
        } else {
          window.__visibleTypes.delete(t);
        }
        applyTypeFilter();
      });
    });
    document.getElementById('selectAllTypes').addEventListener('click', () => {
      allTypes.forEach(t => window.__visibleTypes.add(t));
      document.querySelectorAll('.type-cb').forEach(cb => cb.checked = true);
      applyTypeFilter();
    });
    document.getElementById('deselectAllTypes').addEventListener('click', () => {
      window.__visibleTypes.clear();
      document.querySelectorAll('.type-cb').forEach(cb => cb.checked = false);
      applyTypeFilter();
    });

    // v26.2: legend 行业 click 同步设置 funnel state (联动 aggPanel)
    document.querySelectorAll('.legend-item[data-industry]').forEach(el => {
      el.addEventListener('click', () => {
        const ind = el.dataset.industry;

          clearFocus();
          // 恢复 L0 funnel state
          if (window.__dataFunnel) {
            window.__dataFunnel.level = 'L0';
            window.__dataFunnel.currentIndustry = null;
            window.__dataFunnel.currentNode = null;
          }
          if (typeof window.__renderAggPanel === 'function') window.__renderAggPanel();
        } else {
          focusIndustry(ind);
          // v26.2: 同步设置 funnel state 让 aggPanel 显示该行业聚合
          if (window.__dataFunnel) {
            window.__dataFunnel.level = 'L1';
            window.__dataFunnel.currentIndustry = ind;
            window.__dataFunnel.currentNode = null;
          }
          if (typeof window.__renderAggPanel === 'function') window.__renderAggPanel();
        }
      });
    });

    document.querySelectorAll('.legend-item[data-type]').forEach(el => {
      el.addEventListener('click', () => {
        const t = el.dataset.type;
        if (currentTypeFocus === t) {
          clearFocus();
        } else {
          focusType(t);
        }
      });
    });
  }

  // ===========================
  // 7. 控件（V5：删除行业下拉，仅保留重置 + 清除聚焦）
  // ===========================
  function initControls() {
    document.getElementById('btnReset').addEventListener('click', () => {
      Graph.zoomToFit(800, 60);
    });
    document.getElementById('btnClearFocus').addEventListener('click', clearFocus);

    document.getElementById('statIndustries').textContent =
      new Set(rawData.entities.map(e => e.industry)).size;
  }

  // ===========================
  // 8. 工具函数
  // ===========================
  function updateStats() {
    document.getElementById('statEntities').textContent = graphData.nodes.length;
    document.getElementById('statEdges').textContent = graphData.links.length;
  }

  function escapeHtml(s) {
    if (typeof s !== 'string') return s;
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // ===========================
  // 启动
  // ===========================
  loadData().catch(err => {
    console.error('[V5] 加载失败:', err);
    document.getElementById('loader').innerHTML = `<div style="color:#f87171">❌ 加载失败: ${err.message}</div>`;
  });
  handleEntityParam();
  // P228: URL 参数 entity=xxx — 从报告页跳转自动定位+弹出详情卡
  function handleEntityParam() {
    const params = new URLSearchParams(window.location.search);
    const entityName = params.get('entity');
    if (!entityName) return;
    setTimeout(() => {
      if (!Graph || !window.__dataFunnel) return;
      const node = (window.graphData?.nodes || []).find(n =>
        (n.name || '').toLowerCase() === entityName.toLowerCase()
      );
      if (!node) { console.warn('[P228] 未找到实体:', entityName); return; }
      window.__dataFunnel.level = 'L4';
      window.__dataFunnel.currentNode = node.id;
      window.__applyDataFunnel();
      setTimeout(() => {
        if (node.x !== undefined) {
          Graph.centerAt(node.x, node.y, 800);
          Graph.zoom(3, 800);
        }
        if (typeof window.__showDetailCard === 'function') window.__showDetailCard(node);
      }, 500);
    }, 1500);
  }
</script>
</body>
