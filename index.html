  // ===========================
  // 5. 行业聚焦（V5 修复：物理过滤 graphData）
  // V4 根因诊断（16:13）：hidden=true 不重算 d3-force + zoomToFit 不动坐标
  // V5 修复：物理替换 graphData（仅该行业节点 + 仅含两端都可见的边）
  //         + 强 charge/link 让节点聚类排斥
  // ===========================
  function focusIndustry(industry) {
    if (industry === '__all__' || !industry) {
      clearFocus();
      return;
    }

    currentFocus = industry;
    console.log('[V5] 聚焦行业:', industry);

    // V6 关键修复 1/3：物理过滤节点（仅保留该行业节点）
    const visibleNodes = graphData.nodes.filter(n => n.industry === industry);
    const visibleNodeIds = new Set(visibleNodes.map(n => n.id));

    // V6 关键修复 2/3：保留所有与 visible 节点相连的边（包括跨行业）
    // 用 sourceId/targetId 记录原始 ID，但只渲染 visible 节点的边
    // 力导向只认节点，所以其他节点不显示
    // 但边保留可看到该行业与外部的连接关系
    // V12 关键修复：只保留两端都在 visibleNodes 内的边（避免 node not found 错误）
    // 之前 V11 的 OR filter 导致 1053 条边引用了不存在的节点（跨行业）
    // 改用 AND filter：只保留该行业内部的边（数量少但稳定）
    const visibleLinks = graphData.links
      .filter(l => {
        const sId = typeof l.source === 'string' ? l.source : (l.source && l.source.id);
        const tId = typeof l.target === 'string' ? l.target : (l.target && l.target.id);
        return visibleNodeIds.has(sId) && visibleNodeIds.has(tId);  // V12: 改 OR 为 AND
      })
      .map(l => {
        const sId = typeof l.source === 'string' ? l.source : (l.source && l.source.id);
        const tId = typeof l.target === 'string' ? l.target : (l.target && l.target.id);
        const newObj = {
          source: sId,
          target: tId,
          type: l.type,
          color: l.color,
          isSourceInIndustry: true,
          isTargetInIndustry: true
        };
        // P247 v5 (2026-08-12): 点击节点后，focusIndustry 创建的新 link 也设 _edgeHidden
        if (window.__postFocusNode && window.__postFocusNode.id) {
          const nid = window.__postFocusNode.id;
          newObj._edgeHidden = !(sId === nid || tId === nid);
        } else {
          newObj._edgeHidden = true;  // 无选中节点时所有边隐藏
        }
        return newObj;
      });
    console.log('[V12] 边过滤结果:', {
      total: graphData.links.length,
      visible: visibleLinks.length,
      bothInIndustry: visibleLinks.length
    });

    console.log('[V5] 物理过滤:', {
      nodes: visibleNodes.length,
      links: visibleLinks.length,
      sampleNodes: visibleNodes.slice(0, 3).map(n => n.name)
    });

    // V6 关键修复 3/3：环形初始位置 + 中心 cluster force
    const N = visibleNodes.length;
    const radius = Math.sqrt(N) * 35;
    visibleNodes.forEach((n, i) => {
      const angle = (i / N) * 2 * Math.PI;
      n.x = Math.cos(angle) * radius;
      n.y = Math.sin(angle) * radius;
      // V6: 临时固定位置，防止被 zoomToFit 压缩
      n.fx = n.x;
      n.fy = n.y;
    });

    console.log('[V6] 节点环形位置:', { N, radius, sampleXY: visibleNodes.slice(0, 3).map(n => ({x: n.x, y: n.y})) });

    // 核心：物理替换 graphData（仅 visible 节点 + 仅与 visible 节点相连的边）
    const newData = { nodes: visibleNodes, links: visibleLinks };
    Graph.graphData(newData);
    console.log('[V8] Graph.graphData 已重设:', { nodes: newData.nodes.length, links: newData.links.length });

    // v32: 修复 focusIndustry 三个根因（点击行业一团乱麻 + 偏离页面 + 没引力和聚类）
    // 根因 1：focusIndustry 创建新 __d3Sim 但没 forceX/Y → 行业引力聚类完全失效
    // 根因 2：环形初始位置在 (0,0) 周围，没调 Graph.centerAt(0,0) → 视图偏离出页面
    // 根因 3：1500ms 后才释放 fx/fy → 一团乱麻过渡

    // v32 修复：预设 visibleNodes 的 targetX/targetY 为该行业的环形位置（保持一致）
    const industryTargetX = 0, industryTargetY = 0;
    visibleNodes.forEach(n => {
      n.targetX = industryTargetX;
      n.targetY = industryTargetY;
    });

    // 重新设置强聚类排斥（使用 d3-force 原生配置，不调用 .strength() API）
    // V15 关键修复：完全抛弃 Graph.d3Force() API，改用独立 d3-force 3.x
    if (typeof d3 !== 'undefined' && d3.forceSimulation) {
      // 停止旧仿真
      if (window.__d3Sim) { try { window.__d3Sim.stop(); } catch(e) {} }
      // V15 + v32: 创建独立 d3-force 仿真实例（这是真正驱动节点移动的方式）
      // v32 修复：加入 forceX/Y 让行业聚类生效
      window.__d3Sim = d3.forceSimulation(visibleNodes)
        .force('charge', d3.forceManyBody().strength(-400))         // 强排斥
        .force('link', d3.forceLink(visibleLinks).id(d => d.id).distance(50))  // 连线距离
        .force('center', d3.forceCenter(0, 0).strength(0.1))       // 中心引力
        .force('collide', d3.forceCollide ? d3.forceCollide(15) : null)  // 防止重叠
        // v32: 加 forceX/Y — 行业聚类（根因 1 修复）
        .force('x', d3.forceX(0).strength(0.08))   // v32: 所有节点拉向 X=0
        .force('y', d3.forceY(0).strength(0.08))   // v32: 所有节点拉向 Y=0
        .alpha(1)                  // 立即开始
        .alphaDecay(0.05)         // v29: 0.01 → 0.05（5 倍加速衰减，~10fps 收敛）
        .velocityDecay(0.4)
        .restart();
      console.log('[V15+v32] 独立 d3-force 仿真已启动 (industry):', {
        nodes: visibleNodes.length,
        links: visibleLinks.length,
        alpha: window.__d3Sim.alpha(),
        d3_version: d3.version || 'unknown'
      });
    } else {
      console.error('[V15+v32] d3-force 3.x 未加载！请检查 CDN');
    }

    // v32 修复：立即释放 fx/fy（根因 3 修复 - 消除 1500ms 乱麻过渡）
    // 不再 setTimeout 延迟释放
    visibleNodes.forEach(n => { n.fx = null; n.fy = null; });
    Graph.graphData(newData);  // 触发 d3-force 重计算
    console.log('[V32] fx/fy 立即释放（消除 1500ms 乱麻过渡）');

    // v32 修复：调用 Graph.centerAt(0,0) 让视图居中到行业聚类中心（根因 2 修复）
    if (typeof Graph !== 'undefined' && typeof Graph.centerAt === 'function') {
      try {
        Graph.centerAt(0, 0, 600);  // 600ms 平滑动画到中心
        console.log('[V32] Graph.centerAt(0,0) 已调用 — 视图居中');
      } catch(e) {
        console.warn('[V32] Graph.centerAt 失败:', e.message);
      }
    }

    // 更新控件状态
    document.querySelectorAll('.legend-item[data-industry]').forEach(el => {
      el.classList.toggle('active', el.dataset.industry === industry);
    });
    document.querySelectorAll('.legend-item[data-type]').forEach(el => {
      el.classList.remove('active');
    });

    // v19 fix Bug 6: 切换行业时同步触发 subIndustry 二级下钻
    // v26: __updateSubIndustryPanel 已融合到 aggPanel

    if (typeof window.__renderAggPanel === 'function') window.__renderAggPanel();

    updateFocusDisplay(visibleNodes.length, visibleLinks.length);
    console.log('[V6] updateFocusDisplay 传入:', { visibleNodes: visibleNodes.length, visibleLinks: visibleLinks.length });
  }

  // B6: 类型过滤器（按 checkbox 多选结果过滤可见节点）
  function applyTypeFilter() {
    if (!window.__visibleTypes) return;
    const visibleTypes = window.__visibleTypes;
    const filteredNodes = graphData.nodes.filter(n => visibleTypes.has(n.type));
    const visibleNodeIds = new Set(filteredNodes.map(n => n.id));
    // V12: 只保留两端都在 visible 内的边
    const filteredLinks = graphData.links.filter(l => {
      const s = typeof l.source === 'string' ? l.source : (l.source && l.source.id);
      const t = typeof l.target === 'string' ? l.target : (l.target && l.target.id);
      return visibleNodeIds.has(s) && visibleNodeIds.has(t);
    });
    Graph.graphData({ nodes: filteredNodes, links: filteredLinks });

    // P243 Fix (2026-08-12): 设置 _edgeHidden 让 applyEdgeTypeFilter 能同步感知类型过滤
    // 之前：applyEdgeTypeFilter 只看关系类型，忽略实体类型过滤 → 虚空链接
    graphData.links.forEach(l => {
      const s = typeof l.source === 'string' ? l.source : (l.source && l.source.id);
      const t = typeof l.target === 'string' ? l.target : (l.target && l.target.id);
      l._edgeHidden = !(visibleNodeIds.has(s) && visibleNodeIds.has(t));
      l._dimmed = l._edgeHidden;
    });

    // B6: 应用过滤后重启 d3-force 仿真
    if (window.__d3Sim) {
      window.__d3Sim.nodes(filteredNodes);
      if (filteredLinks.length > 0) {
        window.__d3Sim.force('link').links(filteredLinks);
      }
      window.__d3Sim.alpha(0.5).restart();
    }
    
    updateFocusDisplay(filteredNodes.length, filteredLinks.length);
    console.log('[B6] type 过滤:', {
      visibleTypes: Array.from(visibleTypes),
      visibleNodes: filteredNodes.length,
      visibleLinks: filteredLinks.length
    });
  }

  function clearFocus() {
    currentFocus = null;
    currentTypeFocus = null;
    selectedNode = null;

    // V5 关键修复：恢复原始 graphData
    Graph.graphData(graphData);

    // v23 关键修复：clearFocus 内 visibleNodes 引用了 focusIndustry/focusType 的局部变量
    // 修复：clearFocus 是恢复全景，应该用原始 graphData
    const _origNodes = graphData.nodes;
    const _origLinks = graphData.links;

    // 重新设置强聚类排斥
    // V15 关键修复：完全抛弃 Graph.d3Force() API，改用独立 d3-force 3.x
    if (typeof d3 !== 'undefined' && d3.forceSimulation) {
      // 停止旧仿真
      if (window.__d3Sim) { try { window.__d3Sim.stop(); } catch(e) {} }
      // V15: 创建独立 d3-force 仿真实例（这是真正驱动节点移动的方式）
      window.__d3Sim = d3.forceSimulation(_origNodes)
        .force('charge', d3.forceManyBody().strength(-400))         // 强排斥
        .force('link', d3.forceLink(_origLinks).id(d => d.id).distance(50))  // 连线距离
        .force('center', d3.forceCenter(0, 0).strength(0.1))       // 中心引力
        .force('collide', d3.forceCollide ? d3.forceCollide(15) : null)  // 防止重叠
        .alpha(1)                  // 立即开始
        .alphaDecay(0.05)         // v29: 0.01 → 0.05（5 倍加速衰减，~10fps 收敛）
        .velocityDecay(0.4)
        .restart();
      console.log('[V15] 独立 d3-force 仿真已启动 (clearFocus 全景):', {
        nodes: _origNodes.length,
        links: _origLinks.length,
        alpha: window.__d3Sim.alpha(),
        d3_version: d3.version || 'unknown'
      });
    } else {
      console.error('[V15] d3-force 3.x 未加载！请检查 CDN');
    }

    // 1500ms 后 zoomToFit 全景
    setTimeout(() => {
      try {
        Graph.zoomToFit(1000, 80);
        console.log('[V6] 恢复全景 zoomToFit 完成');
      } catch (e) {
        console.warn('[V6] 恢复 zoomToFit 失败:', e);
      }
    }, 2000);

    document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('active'));
    updateFocusDisplay(graphData.nodes.length, graphData.links.length);
    // v25: 联动隐藏 subIndustryPanel（恢复全景时清除）
    // v26: __updateSubIndustryPanel 已融合到 aggPanel

    if (typeof window.__renderAggPanel === 'function') window.__renderAggPanel();
  }

  function focusType(type) {
    currentTypeFocus = type;
    currentFocus = null;

    // V12：物理过滤 + AND filter（两端都在 visible 内才保留）
    const visibleNodes = graphData.nodes.filter(n => n.type === type);
    const visibleNodeIds = new Set(visibleNodes.map(n => n.id));
    const visibleLinks = graphData.links.filter(l => {
      const s = typeof l.source === 'string' ? l.source : (l.source && l.source.id);
      const t = typeof l.target === 'string' ? l.target : (l.target && l.target.id);
      return visibleNodeIds.has(s) && visibleNodeIds.has(t);  // V12: AND
    });

    const N = visibleNodes.length;
    const radius = Math.sqrt(N) * 35;
    visibleNodes.forEach((n, i) => {
      const angle = (i / N) * 2 * Math.PI;
      n.x = Math.cos(angle) * radius;
      n.y = Math.sin(angle) * radius;
    });

    const newData = { nodes: visibleNodes, links: visibleLinks };
    Graph.graphData(newData);

    // V15 关键修复：完全抛弃 Graph.d3Force() API，改用独立 d3-force 3.x
    if (typeof d3 !== 'undefined' && d3.forceSimulation) {
      // 停止旧仿真
      if (window.__d3Sim) { try { window.__d3Sim.stop(); } catch(e) {} }
      // V15: 创建独立 d3-force 仿真实例（这是真正驱动节点移动的方式）
      window.__d3Sim = d3.forceSimulation(visibleNodes)
        .force('charge', d3.forceManyBody().strength(-400))         // 强排斥
        .force('link', d3.forceLink(visibleLinks).id(d => d.id).distance(50))  // 连线距离
        .force('center', d3.forceCenter(0, 0).strength(0.1))       // 中心引力
        .force('collide', d3.forceCollide ? d3.forceCollide(15) : null)  // 防止重叠
        .alpha(1)                  // 立即开始
        .alphaDecay(0.05)         // v29: 0.01 → 0.05（5 倍加速衰减，~10fps 收敛）
        .velocityDecay(0.4)
        .restart();
      console.log('[V15] 独立 d3-force 仿真已启动 (industry):', {
        nodes: visibleNodes.length,
        links: visibleLinks.length,
        alpha: window.__d3Sim.alpha(),
        d3_version: d3.version || 'unknown'
      });
    } else {
      console.error('[V15] d3-force 3.x 未加载！请检查 CDN');
    }
    Graph.d3Force('center').strength(0.1);
    try { Graph.d3ReheatSimulation(); } catch(e) {}

    setTimeout(() => {
      try {
        Graph.zoomToFit(1000, 80);
      } catch (e) {}
    }, 2000);

    document.querySelectorAll('.legend-item[data-industry]').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.legend-item[data-type]').forEach(el => {
      el.classList.toggle('active', el.dataset.type === type);
    });
    updateFocusDisplay(visibleNodes.length, visibleLinks.length);
  }

  function updateFocusDisplay(visibleCount, linkCount) {
    document.getElementById('focusName').textContent =
      currentFocus || currentTypeFocus || (selectedNode ? selectedNode.name : '全景');
    document.getElementById('focusCount').textContent = visibleCount || 0;
    document.getElementById('statEntities').textContent = visibleCount || graphData.nodes.length;
    document.getElementById('statEdges').textContent = linkCount || graphData.links.length;
  }

  // ===========================
  // 6. 图例（V5 关键：仅右侧图例）
  // ===========================
  function initLegend() {
    const industries = {};
    rawData.entities.forEach(e => {
      if (e.industry) industries[e.industry] = (industries[e.industry] || 0) + 1;
    });
    const top = Object.entries(industries).sort((a, b) => b[1] - a[1]).slice(0, 12);

    const legendHtml = top.map(([ind, count]) => {
      const sample = rawData.entities.find(e => e.industry === ind && e.color);
      const color = sample ? sample.color : '#FFD700';
      return `<div class="legend-item" data-industry="${escapeHtml(ind)}" style="color:#ccc">
        <div class="legend-color" style="background:${color}"></div>
        <span>${escapeHtml(ind)} (${count})</span>
      </div>`;
    }).join('');

    // B6: type 改为 checkbox 多选（控制可见的 type 类别）
    const allTypes = Object.keys(TYPE_COLORS);
    if (!window.__visibleTypes) {
      // v30.3: 主公决策方案 A —— 默认显示 ORG（公司企业）+ INDUSTRY（行业）2 种
      // 共 1250 节点（ORG 952 + INDUSTRY 298），开局更聚焦
      // 其他 9 种类型（PRODUCT/TECH/POLICY/PERSON/PLACE/INDICATOR/RISK/CONCEPT/CHANNEL）
      // 手动点击 legend checkbox 才显示
      window.__visibleTypes = new Set(['ORG', 'INDUSTRY']);
      // v30.2: 重要修复 — 初始化后必须立即调用 applyTypeFilter() 让默认过滤生效
      // 根因：之前仅设 __visibleTypes 但未调 applyTypeFilter → graphData 仍显示全部 2420 个
      // 修复：首次设置默认可见类型后立即调一次 applyTypeFilter() 让真正过滤生效
      if (typeof applyTypeFilter === 'function') applyTypeFilter();
    }
    const typeHtml = Object.entries(TYPE_COLORS).map(([t, c]) => {
      const count = rawData.entities.filter(e => e.type === t).length;
      const checked = window.__visibleTypes.has(t) ? 'checked' : '';
      return `<label class="legend-item legend-type-checkbox" data-type="${t}" style="color:#ccc">
        <input type="checkbox" class="type-cb" data-type="${t}" ${checked}>
        <div class="legend-color" style="background:${c}"></div>
        <span>${t} (${count})</span>
      </label>`;
    }).join('');

    const html = `<h4>🏭 Top 12 行业（点击聚焦）</h4>${legendHtml}
      <h4 style="margin-top:12px">📦 实体类型（多选控制显示）</h4>
      <div style="margin-bottom:8px"><button id="selectAllTypes" style="font-size:12px;padding:2px 8px">全选</button> <button id="deselectAllTypes" style="font-size:12px;padding:2px 8px">全不选</button></div>
      ${typeHtml}`;

    document.getElementById('legendContent').innerHTML = html;

    // B6: 绑定 checkbox 事件
    document.querySelectorAll('.type-cb').forEach(cb => {
      cb.addEventListener('change', () => {
        const t = cb.dataset.type;
        if (cb.checked) {
          window.__visibleTypes.add(t);
        } else {
          window.__visibleTypes.delete(t);
        }
        applyTypeFilter();
      });
    });
    document.getElementById('selectAllTypes').addEventListener('click', () => {
      allTypes.forEach(t => window.__visibleTypes.add(t));
      document.querySelectorAll('.type-cb').forEach(cb => cb.checked = true);
      applyTypeFilter();
    });
    document.getElementById('deselectAllTypes').addEventListener('click', () => {
      window.__visibleTypes.clear();
      document.querySelectorAll('.type-cb').forEach(cb => cb.checked = false);
      applyTypeFilter();
    });

    // v26.2: legend 行业 click 同步设置 funnel state (联动 aggPanel)
    document.querySelectorAll('.legend-item[data-industry]').forEach(el => {
      el.addEventListener('click', () => {
        const ind = el.dataset.industry;
        if (currentFocus === ind) {
          clearFocus();
          // 恢复 L0 funnel state
          if (window.__dataFunnel) {
            window.__dataFunnel.level = 'L0';
            window.__dataFunnel.currentIndustry = null;
            window.__dataFunnel.currentNode = null;
          }
          if (typeof window.__renderAggPanel === 'function') window.__renderAggPanel();
        } else {
          focusIndustry(ind);
          // v26.2: 同步设置 funnel state 让 aggPanel 显示该行业聚合
          if (window.__dataFunnel) {
            window.__dataFunnel.level = 'L1';
            window.__dataFunnel.currentIndustry = ind;
            window.__dataFunnel.currentNode = null;
          }
          if (typeof window.__renderAggPanel === 'function') window.__renderAggPanel();
        }
      });
    });

    document.querySelectorAll('.legend-item[data-type]').forEach(el => {
      el.addEventListener('click', () => {
        const t = el.dataset.type;
        if (currentTypeFocus === t) {
          clearFocus();
        } else {
          focusType(t);
        }
      });
    });
  }

  // ===========================
  // 7. 控件（V5：删除行业下拉，仅保留重置 + 清除聚焦）
  // ===========================
  function initControls() {
    document.getElementById('btnReset').addEventListener('click', () => {
      Graph.zoomToFit(800, 60);
    });
    document.getElementById('btnClearFocus').addEventListener('click', clearFocus);

    document.getElementById('statIndustries').textContent =
      new Set(rawData.entities.map(e => e.industry)).size;
  }

  // ===========================
  // 8. 工具函数
  // ===========================
  function updateStats() {
    document.getElementById('statEntities').textContent = graphData.nodes.length;
    document.getElementById('statEdges').textContent = graphData.links.length;
  }

  function escapeHtml(s) {
    if (typeof s !== 'string') return s;
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // ===========================
  // 启动
  // ===========================
  loadData().catch(err => {
    console.error('[V5] 加载失败:', err);
    document.getElementById('loader').innerHTML = `<div style="color:#f87171">❌ 加载失败: ${err.message}</div>`;
  });

  // ===========================
  // P228: URL 参数 entity=xxx — 从报告页跳转自动定位+弹出详情卡
  // ===========================
  function handleEntityParam() {
    const params = new URLSearchParams(window.location.search);
    const entityName = params.get('entity');
    if (!entityName) return;
    setTimeout(() => {
      if (!Graph || !window.__dataFunnel) return;
      const node = (window.graphData?.nodes || []).find(n =>
        (n.name || '').toLowerCase() === entityName.toLowerCase()
      );
      if (!node) {
        console.warn('[P228] 未找到实体:', entityName);
        return;
      }
      // 展开到 L4 详情
      window.__dataFunnel.level = 'L4';
      window.__dataFunnel.currentNode = node.id;
      window.__applyDataFunnel();
      setTimeout(() => {
        if (node.x !== undefined) {
          Graph.centerAt(node.x, node.y, 800);
          Graph.zoom(3, 800);
        }
        if (typeof window.__showDetailCard === 'function') {
          window.__showDetailCard(node);
        }
      }, 500);
    }, 1500);
  }
  handleEntityParam();
</script>
</body>
