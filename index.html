<!-- B3 关键：加载完整 d3 v7（包含 d3-force + d3-timer 等所有依赖） -->
<script src="https://unpkg.com/force-graph@1.43.5/dist/force-graph.min.js"></script>
<script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
<script>
  const TYPE_COLORS = {
    INDUSTRY: '#FFD700', ORG: '#4ec9ff', PRODUCT: '#ff6b9d',
    TECH: '#a78bfa', POLICY: '#fbbf24', PERSON: '#34d399',
    PLACE: '#60a5fa', INDICATOR: '#f87171', RISK: '#dc2626',
    CONCEPT: '#94a3b8', CHANNEL: '#10b981',
  };
  
  // 方向 1: 节点形状映射（按 type 分配 8 种形状 - 行业标准）
  const TYPE_SHAPES = {
    'INDUSTRY': 'hexagon',   // 行业 - 六边形
    'ORG': 'roundedRect',    // 公司 - 圆角矩形
    'PERSON': 'circle',      // 人物 - 圆形
    'PRODUCT': 'parallelogram', // 产品 - 平行四边形
    'TECH': 'diamond',       // 技术 - 菱形
    'POLICY': 'rect',        // 政策 - 矩形
    'PLACE': 'star',         // 地点 - 星形
    'INDICATOR': 'ellipse',  // 指标 - 椭圆形
    'RISK': 'triangle',      // 风险 - 三角形（警告）
    'ECON_CONCEPT': 'circle', // 经济概念 - 圆形
    'FIN_PRODUCT': 'roundedRect' // 金融产品 - 圆角矩形
  };
  
  // 方向 2: 边类型样式映射（按 edge.type 分配颜色 + 箭头）
  // v49 调整: 提亮颜色让深色背景清晰可见
  const EDGE_STYLES = {
    '监管': { color: 'rgba(255,100,100,1)', width: 2.0, arrow: 'full', label: '监管' },
    '投资': { color: 'rgba(255,220,80,1)', width: 1.8, arrow: 'full', label: '投资' },
    '供需': { color: 'rgba(120,200,255,1)', width: 1.5, arrow: 'arrow', label: '供需' },
    '合作': { color: 'rgba(140,240,140,1)', width: 1.5, arrow: 'arrow', label: '合作' },
    '竞争': { color: 'rgba(255,170,100,1)', width: 1.3, arrow: 'arrow', label: '竞争', dash: [5, 3] },
    '相关': { color: 'rgba(200,200,220,0.7)', width: 0.6, arrow: 'none', label: '相关' },
    '上下游': { color: 'rgba(200,150,240,1)', width: 1.5, arrow: 'arrow', label: '上下游' },
    '客户': { color: 'rgba(255,215,0,1)', width: 1.5, arrow: 'arrow', label: '客户' },
    '供应': { color: 'rgba(170,230,255,1)', width: 1.5, arrow: 'arrow', label: '供应' },
    '战略联盟': { color: 'rgba(180,180,255,1)', width: 1.5, arrow: 'arrow', label: '战略联盟' },
    '技术链': { color: 'rgba(160,255,200,1)', width: 1.5, arrow: 'arrow', label: '技术链' },
    '子公司': { color: 'rgba(220,160,255,1)', width: 1.5, arrow: 'arrow', label: '子公司' },
    '母公司': { color: 'rgba(240,180,220,1)', width: 1.5, arrow: 'arrow', label: '母公司' },
    '股东': { color: 'rgba(255,200,150,1)', width: 1.5, arrow: 'arrow', label: '股东' },
    '对比': { color: 'rgba(100,220,255,1)', width: 1.5, arrow: 'arrow', label: '对比' }
  };
  const EDGE_DEFAULT = { color: 'rgba(220,220,240,0.7)', width: 0.8, arrow: 'none', label: '关系' };

  const TYPE_SIZE = {
    INDUSTRY: 8, ORG: 5, PRODUCT: 4, TECH: 4, POLICY: 4,
    PERSON: 5, PLACE: 4, INDICATOR: 5, RISK: 6, CONCEPT: 5, CHANNEL: 4,
  };

  let rawData = null;
  let graphData = null;
  let Graph = null;
  let currentFocus = null;
  let currentTypeFocus = null;
  let selectedNode = null;

  // P229 v6 (2026-07-31): 根本性架构修复 — industry-based enrichment 懒加载
  // 废弃 enrichment_top.json（单文件 54MB），改用行业分桶文件（industries/*.json，~1-2MB/个）
  // 前端：点击节点 → 查 entity_industry_index.json → 加载对应行业文件 → 提取 enrichment → 缓存
  let entityIndustryIndex = null;
  let industryFileCache = {};  // industry_name → [entities with enrichment]
  let indexLoading = false;
  let indexLoaded = false;

  // P229 v6: 加载 entity_industry_index.json（entity_id → industry_name，~50KB）
  async function loadIndustryIndex() {
    if (indexLoading || indexLoaded) return;
    indexLoading = true;
    try {
      const cb = '?v=' + Date.now();
      const res = await fetch('./entity_industry_index.json' + cb, { cache: 'no-store' });
      if (res.ok) {
        entityIndustryIndex = await res.json();
        indexLoaded = true;
        console.log('[P229 v6] entity_industry_index.json 已加载:', Object.keys(entityIndustryIndex).length, '条');
      }
    } catch (e) {
      console.warn('[P229 v6] index 加载失败:', e.message);
    } finally {
      indexLoading = false;
    }
  }

  // P229 v6: 懒加载行业文件 + 提取 enrichment
  async function loadIndustryFile(industry) {
    if (!industry) return null;
    if (industryFileCache[industry]) return industryFileCache[industry];
    try {
      const cb = '?v=' + Date.now();
      // P248 v14: gzip 优先加载（13MB 行业文件），失败降级 .json
      try {
        const gzRes = await fetch(`./industries/${industry}.json.gz` + cb, { cache: 'no-store' });
        if (gzRes.ok && typeof DecompressionStream !== 'undefined') {
          const buf = await gzRes.arrayBuffer();
          const ds = new DecompressionStream('gzip');
          const text = await new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
          const data = JSON.parse(text);
          industryFileCache[industry] = data;
          console.log(`[P229 v6] 行业文件 ${industry}.json.gz 已加载: ${data.length} 实体`);
          return data;
        }
      } catch (e) { /* .gz 不可用 → 降级 */ }
      const res = await fetch(`./industries/${industry}.json` + cb, { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        industryFileCache[industry] = data;  // 缓存完整行业数据
        console.log(`[P229 v6] 行业文件 ${industry}.json 已加载: ${data.length} 实体`);
        return data;
      }
    } catch (e) {
      console.warn(`[P229 v6] 行业文件 ${industry}.json 加载失败:`, e.message);
    }
    return null;
  }
  
  // 第二个 fetch 位置（如果存在，看 preloadEnrichment 那处）

  // P229 v6: 为 node 注入 enrichment 数据（从 industry 文件提取）
  async function attachEnrichment(node) {
    const eid = node.id;
    if (!eid) return;
    // 等待索引加载完成
    if (!indexLoaded) await loadIndustryIndex();
    // P248 v9 Fix: 索引缺失时 fallback 到 node.industry（与 preloadEnrichment 一致）
    let industry = entityIndustryIndex?.[eid];
    if (!industry) {
      industry = node.industry || node.sector;
      if (!industry) return;
    }
    // 加载行业文件（缓存）
    const industryData = await loadIndustryFile(industry);
    if (!industryData) return;
    // 从行业文件中找到该实体的 enrichment
    const enriched = industryData.find(e => e.id === eid);
    if (!enriched) return;
    node._logicRefs = enriched._logicRefs || [];
    node._indicators = enriched._indicators || [];
    node._frameworks = enriched._frameworks || [];
    node._reports = enriched._reports || [];
    // relatedEntities: 从 graphData.links 推导
    if (!node._relatedEntities || node._relatedEntities.length === 0) {
      const related = [];
      graphData.links.forEach(l => {
        const src = typeof l.source === 'object' ? l.source.id : l.source;
        const tgt = typeof l.target === 'object' ? l.target.id : l.target;
        if (src === eid && tgt !== eid) {
          const t = graphData.nodes.find(n => n.id === tgt);
          if (t) related.push({ id: t.id, name: t.name, type: t.typeLabel || t.type, relations: [l.type || '相关'], relation_count: 1 });
        } else if (tgt === eid && src !== eid) {
          const t = graphData.nodes.find(n => n.id === src);
          if (t) related.push({ id: t.id, name: t.name, type: t.typeLabel || t.type, relations: [l.type || '相关'], relation_count: 1 });
        }
      });
      node._relatedEntities = related;
    }
  }

  // P247 v1 (2026-08-12): 批量预加载 enrichment（先按行业分桶 → 每个行业 fetch 一次 → 注入所有实体）
  // 根因: entities.json 只有 16 基础字段，无 _indicators/_reports/_relatedEntities/_logicRefs/_frameworks
  // 旧版 data.json 自带 enrichment → transformData 直接读取；pipe_split 架构丢失该数据
  // 修复: 页面加载时按行业批量 fetch，注入每个实体；点击时 attachEnrichment 仍保留作为 fallback
  async function preloadEnrichment() {
    if (!indexLoaded) await loadIndustryIndex();
    const entities = rawData.entities;
    // 按行业分桶（优先用 index 映射，fallback 用 entity.industry）
    const industryBuckets = new Map();
    for (const e of entities) {
      let ind = entityIndustryIndex?.[e.id] || e.industry || 'unknown';
      if (!ind || ind === 'unknown') continue;
      if (!industryBuckets.has(ind)) industryBuckets.set(ind, []);
      industryBuckets.get(ind).push(e);
    }
    console.log('[P247] 需预加载行业数:', industryBuckets.size, '覆盖实体数:',
      Array.from(industryBuckets.values()).reduce((s, v) => s + v.length, 0));

    // P248 Fix (2026-08-13): 并行加载 + 超时，防止单文件 hung 导致页面永久卡在"加载数据中"
    const stats = { fetchedIndustries: 0, injectedEntities: 0 };
    const industryEntries = Array.from(industryBuckets.entries());
    const CONCURRENCY = 8; // 并发数
    const FETCH_TIMEOUT = 15000; // 15s 超时

    for (let i = 0; i < industryEntries.length; i += CONCURRENCY) {
      const batch = industryEntries.slice(i, i + CONCURRENCY);
      await Promise.all(batch.map(async ([industry, ents]) => {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT);
          const cb = '?v=' + Date.now();
          // P248 v14: gzip 优先
          try {
            const gzRes2 = await fetch('./industries/' + encodeURIComponent(industry) + '.json.gz' + cb, { cache: 'no-store' });
            if (gzRes2.ok && typeof DecompressionStream !== 'undefined') {
              const buf = await gzRes2.arrayBuffer();
              const ds = new DecompressionStream('gzip');
              const text = await new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
              const data = JSON.parse(text);
              stats.fetchedIndustries++;
              for (const x of data) { if (x.id) lookup.set(x.id, x); }
              if (loadFn) loadFn(lookup);
              return;
            }
          } catch (e) { /* fallback */ }
          const res = await fetch('./industries/' + encodeURIComponent(industry) + '.json' + cb, {
            cache: 'no-store', signal: controller.signal
          });
          clearTimeout(timeoutId);
          if (!res.ok) return;
          const industryData = await res.json();
          stats.fetchedIndustries++;
          const lookup = new Map();
          for (const x of industryData) { if (x.id) lookup.set(x.id, x); }
          for (const e of ents) {
            const enriched = lookup.get(e.id);
            if (!enriched) continue;
            e._logicRefs = enriched._logicRefs || [];
            e._indicators = (enriched._indicators || []).map(ind => ({
              indicator_id: ind.id || ind.indicator_id,
              indicator_name: ind.name || ind.indicator_name,
              name: ind.name || ind.indicator_name,
              indicator_type: ind.type || ind.indicator_type || '其他',
              unit: ind.unit, value: ind.value, is_core: ind.is_core,
              calculation_method: ind.calculation_method, description: ind.description,
            }));
            e._frameworks = (enriched._frameworks || []).map(fw => ({
              framework_id: fw.id || fw.framework_id,
              framework_name: fw.name || fw.framework_name,
              framework_type: fw.type || fw.framework_type,
              category: fw.category, dimension: fw.dimension,
              description: fw.description || fw.premise,
              apply_scenario: fw.apply_scenario, steps: fw.steps, confidence: fw.confidence,
            }));
            e._reports = enriched._reports || [];
            e._relatedEntities = (enriched._relatedEntities || []).map(re => ({
              other_id: re.id,
              relation_type: (Array.isArray(re.relations) ? re.relations[0] : (re.relation_type || '相关')),
              description: re.description || (re.descriptions && re.descriptions[0]) || '',
              dir: re.dir,
            }));
            stats.injectedEntities++;
          }
        } catch(err) { /* 单行业失败不影响其他 */ }
      }));
    }
    console.log('[P247] enrichment 预加载完成:', stats);
  }

  // ===========================
  // 1. 加载数据（从 split 文件：entities.json + relations.json）
  // ===========================
  // P248 v3 (2026-08-13): 逐步加载 + 每步独立 try-catch + 进度日志，防止某一步静默失败导致永久卡住
  async function loadData() {
    const loader = document.getElementById('loader');
    const setLoader = (msg) => { if (loader) loader.innerHTML = msg; };
    const setProgress = (step, extra) => {
      console.log(`[P248] 步骤: ${step} ${extra || ''}`);
      setLoader(`⏳ 加载中... <span style="color:#888;font-size:12px;">${step}</span>`);
    };
    try {
      // 30s 总超时，防止永久卡住
      const controller = new AbortController();
      const timeoutId = setTimeout(() => {
        controller.abort();
        throw new Error('数据加载超时 30s — 请检查浏览器控制台 (F12) 查看详细错误');
      }, 30000);
      
      setProgress('① 加载基础数据...');
      const cacheBuster = '?v=' + Date.now();
      // P248 v14: gzip 优先加载（GitHub Pages CDN 无 gzip，7.6MB 原样传输超时）
      // 策略: 先试 .gz + DecompressionStream 解压，失败降级 .json
      async function fetchJSONSmart(base, cacheBuster) {
        var url = base + cacheBuster;
        // 线上/本地统一先试 .gz（update: glob 全局看有没有 .gz，没有就 json）
        try {
          var gzRes = await fetch(base + '.gz' + cacheBuster, { cache: 'no-store' });
          if (gzRes.ok && typeof DecompressionStream !== 'undefined') {
            var buffer = await gzRes.arrayBuffer();
            var ds = new DecompressionStream('gzip');
            var stream = new Blob([buffer]).stream().pipeThrough(ds);
            var text = await new Response(stream).text();
            return JSON.parse(text);
          }
        } catch (e) { /* .gz 不存在/失败 → 降级 .json */ }
        var res = await fetch(url, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
        if (!res.ok) throw new Error(base + ' 加载失败: HTTP ' + res.status);
        return await res.json();
      }
      const [entities, relations] = await Promise.all([
        fetchJSONSmart('./entities.json', cacheBuster),
        fetchJSONSmart('./relations.json', cacheBuster)
      ]);
      rawData = { entities, edges: relations };
      console.log('[V5] 加载原始数据:', {
        entities: rawData.entities.length,
        edges: rawData.edges.length,
        industries: new Set(rawData.entities.map(e => e.industry)).size
      });
      setProgress('② 加载行业索引...', `${entities.length} entities, ${relations.length} relations`);
      await loadIndustryIndex();
      setProgress('③ 预加载行业数据...');
      try {
        await preloadEnrichment();
      } catch(err) {
        console.warn('[P248] enrichment 预加载失败，继续...', err.message);
      }
      setProgress('④ 转换图数据...');
      transformData();
      setProgress('⑤ 初始化画布...', `${graphData.nodes.length} nodes, ${graphData.links.length} links`);
      initGraph();
      setProgress('⑥ 初始化控件...');
      initControls();
      initLegend();
      updateStats();
      clearTimeout(timeoutId);
      setProgress('⑦ 完成！', `${graphData.nodes.length} 节点 / ${graphData.links.length} 边`);
      // 延迟 500ms 显示，避免闪屏
      setTimeout(() => { if (loader) loader.classList.add('hidden'); }, 500);
    } catch (err) {
      if (loader) {
        loader.innerHTML = `<div style="color:#f87171;font-size:14px;">❌ 加载失败: ${err.message}<br><small style="color:#888;">按 F12 查看控制台详细信息</small><br><small style="color:#888;">服务器: http://localhost:8000</small></div>`;
      }
      console.error('[V5] 数据加载失败:', err);
    }
  }

  // ===========================
  // 2. 转换为 force-graph 格式
  // ===========================
  function transformData() {
    // v15: 补全 importance / publishDate + 实时计算 degree
    const nodes = rawData.entities.map(e => ({
      id: e.id,
      name: e.name,
      type: e.type,
      industry: e.industry,
      color: e.color || TYPE_COLORS[e.type] || '#888',
      typeLabel: e.typeLabel || e.type,
      desc: e.desc || '',
      val: TYPE_SIZE[e.type] || 4,
      sector: e.sector || '',
      subIndustry: e.subIndustry || '',
      core: e.core || false,
      importance: e.importance || 0,  // v15 数据补全
      publishDate: e.publishDate || '',  // v15 数据补全
      degree: 0,  // v15 数据补全（下面实时计算）
      _logicRefs: e._logicRefs || [],  // v43 R1+ : 真实逻辑链（D1 抽取的 premise/conclusion/reasoning）
      _indicators: e._indicators || [],  // v44 P0-1 : 关联指标（enrich_v44 PG attach）
      _frameworks: e._frameworks || [],  // v44 P0-2 : 研究框架（6 大维度）
      _relatedEntities: e._relatedEntities || [],  // v44 P0-3 : 关联实体（含 description）
      _reports: e._reports || [],  // P221 (2026-07-28): 原始研报数据（report_id + title）
    }));

    const idSet = new Set(nodes.map(n => n.id));
    const links = [];
    const degreeCount = {};
    for (const e of rawData.edges) {
      if (idSet.has(e.source) && idSet.has(e.target) && e.source !== e.target) {
        links.push({
          source: e.source,
          target: e.target,
          type: e.type || '相关',
          color: e.color || '#444',
          confidence: e.confidence || 0.5,  // v44 P1-5: 边粗细=confidence
        });
        // 计算 degree
        degreeCount[e.source] = (degreeCount[e.source] || 0) + 1;
        degreeCount[e.target] = (degreeCount[e.target] || 0) + 1;
      }
    }
    // 把 degree 写回 nodes
    nodes.forEach(n => { n.degree = degreeCount[n.id] || 0; });

    graphData = { nodes, links };
    window.graphData = graphData;
    console.log('[V5] 转换完成:', {
      nodes: graphData.nodes.length,
      links: graphData.links.length
    });
  }

  // ===========================
  // 3. 初始化图（V5 关键：强聚类 + 强排斥，不依赖全局 d3）
  // ===========================
  function initGraph() {
    Graph = ForceGraph()
      (document.getElementById('graph'))
      .graphData(graphData)
      .backgroundColor('rgba(27, 38, 59, 0)')   // v49: 透明背景，让 #graph 容器的渐变显示出来
      .nodeId('id')

      
      .nodeLabel(node => `<div style="background:#1a1a2e;color:#fff;padding:6px 10px;border-radius:6px;border:1px solid #4ec9ff;font-size:12px;max-width:240px">
        <div style="color:#4ec9ff;font-weight:600;margin-bottom:4px">${escapeHtml(node.name)}</div>
        <div style="color:#888;font-size:12px;">${node.typeLabel} · ${node.industry || '未分类'}</div>
        ${node.desc ? `<div style="margin-top:4px;font-size:12px;line-height:1.4">${escapeHtml(node.desc)}${node.desc.length > 100 ? '' : ''}</div>` : ''}
      </div>`)
      .nodeColor(node => {
        // 方向 6: dim 效果 - 未匹配的节点变灰
        if (node._dimmed) return 'rgba(100,100,100,0.2)';
        return node.color;
      })
      .nodeVal(node => {
        // v48 Obsidian 风格: 节点大小用 log2 而非 sqrt（避免放大时增长过快）
        if (node._dimmed) return 0.5;
        const deg = node.degree || 0;
        return Math.log2(deg + 2) * 1.5;
      })  // v48: 节点大小按 log2（Obsidian 风格）
      // P3.1+P3.3: 节点边框 + 智能标签
      .nodeCanvasObjectMode(() => 'after')
      .nodeCanvasObject((node, ctx, globalScale) => {
        // 方向 B: 标签碰撞检测 - 缩放级别决定标签显示
        if (globalScale < 0.7) return;  // 太远不显示
        if (node._tourDim || node._dimmed) return;  // dim 的不显示
        if (!node.name) return;
        // 方向 N: Smart label placement - 高密度/高 importance 节点自动隐藏标签
        // v15 数据补全后使用 importance 作为代理（>10 邻居已映射 importance=3）
        const importance = node.importance || 0;
        // v42 主公选项 P1: Obsidian Text Fade Threshold 3 级模式
        // 设计哲学：缩小文字渐隐，大节点文字 fade-in 更早，小节点晚
        // importance=3 (hub): 0.5 globalScale 即可见（核心枢纽永远可见）
        // importance=2 (中等): 0.7 globalScale 可见
        // importance=1 (普通): 1.5 globalScale 可见（远离时不显示避免遮挡）
        // importance=0 (孤立): 2.0 globalScale 可见
        if (globalScale < 0.5) return;  // 太远完全不显示
        if (importance >= 3) {
          if (globalScale < 0.5) return;  // hub：只要不太远就显示
        } else if (importance >= 2) {
          if (globalScale < 0.7) return;  // 中等：缩到 0.7 才显示
        } else if (importance >= 1) {
          if (globalScale < 1.5) return;  // 普通：缩到 1.5 才显示（避免遮挡）
        } else {
          if (globalScale < 2.0) return;  // 孤立：缩到 2.0 才显示
        }
        
        // v29: 节点大小计算共享常量（避免硬编码不一致）
        const _nodeSize = Math.sqrt((node.degree || 0) + 1) * 2.0;   // v29 节点大小
        
        // 方向 B: 标签碰撞检测（简化版 - 基于相邻节点距离）
        const truncated = node.name.length > 8 && globalScale < 1.2 ? node.name.slice(0, 7) + '…' : node.name;
        const _imp = node.importance || 0;
        // 方向 C: 核心枢纽双重视觉编码 - importance=3 加发光环
        if (_imp === 3) {
          ctx.beginPath();
          ctx.arc(node.x, node.y, _nodeSize + 4, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 50, 50, 0.4)';
          ctx.lineWidth = 2 / globalScale;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(node.x, node.y, _nodeSize + 7, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 100, 100, 0.2)';
          ctx.lineWidth = 1 / globalScale;
          ctx.stroke();
        }
        // v52: 早期 showLabel 代码已删除（带黄色/红色/黑色背景框）
        // 文字渲染改用下方 v51 的 showLabel 代码（文字本身带颜色 + 描边）
        
        // 方向 1: 按 type 画不同形状
        if (node.x === undefined) return;
        const shape = TYPE_SHAPES[node.type] || 'circle';
        const size = node.val || 4;
        
        ctx.beginPath();
        if (shape === 'hexagon') {
          // 六边形（INDUSTRY）
          for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
            const x = node.x + Math.cos(angle) * size;
            const y = node.y + Math.sin(angle) * size;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.closePath();
        } else if (shape === 'roundedRect') {
          // 圆角矩形（ORG / FIN_PRODUCT）
          const w = size * 1.8, h = size * 1.4, r = size * 0.3;
          ctx.moveTo(node.x - w/2 + r, node.y - h/2);
          ctx.lineTo(node.x + w/2 - r, node.y - h/2);
          ctx.arcTo(node.x + w/2, node.y - h/2, node.x + w/2, node.y - h/2 + r, r);
          ctx.lineTo(node.x + w/2, node.y + h/2 - r);
          ctx.arcTo(node.x + w/2, node.y + h/2, node.x + w/2 - r, node.y + h/2, r);
          ctx.lineTo(node.x - w/2 + r, node.y + h/2);
          ctx.arcTo(node.x - w/2, node.y + h/2, node.x - w/2, node.y + h/2 - r, r);
          ctx.lineTo(node.x - w/2, node.y - h/2 + r);
          ctx.arcTo(node.x - w/2, node.y - h/2, node.x - w/2 + r, node.y - h/2, r);
          ctx.closePath();
        } else if (shape === 'rect') {
          // 矩形（POLICY）
          ctx.rect(node.x - size * 1.2, node.y - size * 0.9, size * 2.4, size * 1.8);
        } else if (shape === 'diamond') {
          // 菱形（TECH）
          ctx.moveTo(node.x, node.y - size);
          ctx.lineTo(node.x + size, node.y);
          ctx.lineTo(node.x, node.y + size);
          ctx.lineTo(node.x - size, node.y);
          ctx.closePath();
        } else if (shape === 'parallelogram') {
          // 平行四边形（PRODUCT）
          ctx.moveTo(node.x - size + size * 0.3, node.y - size);
          ctx.lineTo(node.x + size, node.y - size);
          ctx.lineTo(node.x + size - size * 0.3, node.y + size);
          ctx.lineTo(node.x - size, node.y + size);
          ctx.closePath();
        } else if (shape === 'triangle') {
          // 三角形（RISK - 警告）
          ctx.moveTo(node.x, node.y - size);
          ctx.lineTo(node.x + size, node.y + size);
          ctx.lineTo(node.x - size, node.y + size);
          ctx.closePath();
        } else if (shape === 'star') {
          // 星形（PLACE）
          for (let i = 0; i < 10; i++) {
            const r = i % 2 === 0 ? size : size * 0.4;
            const angle = (i / 10) * Math.PI * 2 - Math.PI / 2;
            const x = node.x + Math.cos(angle) * r;
            const y = node.y + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.closePath();
        } else if (shape === 'ellipse') {
          // 椭圆形（INDICATOR）
          ctx.ellipse(node.x, node.y, size * 1.3, size * 0.8, 0, 0, Math.PI * 2);
        } else {
          // 圆形（PERSON / ECON_CONCEPT / 默认）
          ctx.arc(node.x, node.y, size, 0, Math.PI * 2);
        }
        ctx.fillStyle = node.color || '#888';
        ctx.fill();
        
        // 方向 4: 节点重要性分级 - 按重要性显示边框颜色（v49 调亮）
        let borderColor = 'rgba(220,220,240,0.7)';
        let borderW = Math.min(2, (node.degree || 0) / 30);
        if (importance >= 3) {
          borderColor = 'rgba(255,100,100,1)';  // 核心 - 亮红
          borderW = Math.max(borderW, 2);
        } else if (importance >= 2) {
          borderColor = 'rgba(255,215,0,1)';  // 重要 - 亮金
          borderW = Math.max(borderW, 1.5);
        } else if (importance >= 1) {
          borderColor = 'rgba(240,240,255,0.9)';  // 普通 - 亮白
        }
        if (borderW > 0.3) {
          ctx.strokeStyle = borderColor;
          ctx.lineWidth = borderW;
          ctx.stroke();
        }
        
        // 优化 1+4: 4 级 LOD 智能标签（标签碰撞避免）
        const degree = node.degree || 0;
        const zoomK = globalScale;
        let showLabel = false;
        if (zoomK < 0.5) {
          showLabel = degree >= 50;
        } else if (zoomK < 1.0) {
          showLabel = degree >= 20;
        } else if (zoomK < 2.0) {
          showLabel = degree >= 5;
        } else {
          showLabel = true;  // zoom > 2 时显示所有标签
        }
        
        // 优化 1: 标签碰撞避免 - 已显示标签的节点记录位置
        if (showLabel && node.name && node.x !== undefined) {
          // v51: 字体大小绑节点大小 + 文字本身带颜色（按 TYPE_COLORS），无背景框
          const nodeSize = node.val || Math.log2((node.degree || 0) + 2) * 1.5;
          const nodeDiameter = nodeSize * 2;
          const baseFontSize = nodeDiameter * 0.7;
          const fontSize = Math.max(8, Math.min(16, baseFontSize));
          const label = node.name.length > 14 ? node.name.slice(0, 14) + '...' : node.name;
          ctx.font = `bold ${fontSize}px Sans-Serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          
          // v51: 文字颜色 = 实体类型颜色（TYPE_COLORS）
          const textColor = TYPE_COLORS[node.type] || '#e8e8f0';
          ctx.fillStyle = textColor;
          
          // v51: 描边（深色，提升可读性但不是背景框）
          ctx.strokeStyle = 'rgba(13, 27, 42, 0.95)';
          ctx.lineWidth = 3;
          ctx.lineJoin = 'round';
          const labelY = node.y + nodeSize + 3;
          ctx.strokeText(label, node.x, labelY);
          // 主文字（v51 文字本身带颜色，不画背景框）
          ctx.fillText(label, node.x, labelY);
        }
      })
      .nodeRelSize(4)
      // 方向 2: 边类型样式（按 EDGE_STYLES + 箭头 + 标签）
      .linkColor(link => {
        // 方向 6: dim 效果 - 未匹配的边变暗
        if (link._dimmed) return 'rgba(80,80,80,0.15)';
        const style = EDGE_STYLES[link.type] || EDGE_DEFAULT;
        // 弱化弱边
        const w = link.weight || 0.5;
        if (w < 0.5) return style.color.replace(/[\d.]+\)$/, '0.2)');
        return style.color;
      })
      .linkWidth(link => {
        const style = EDGE_STYLES[link.type] || EDGE_DEFAULT;
        const w = link.confidence || 0.5;
        // v48 Obsidian 风格: 边粗细适中（不要 2.5 倍系数）
        const multiplier = w >= 0.9 ? 1.5 : (w >= 0.7 ? 1.0 : 0.7);
        return style.width * multiplier;
      })
      // 方向 A: 边聚合 - 用 linkCanvasObject 画弧形（force-graph 实际渲染层）
      .linkCanvasObjectMode(link => 'replace')  // v36-A2: 全部边用 canvas 画弧（默认隐藏原生线）
      .linkCanvasObject((link, ctx, globalScale) => {
        // v36-A2: 取消 _isAggregated 限制，让所有边都可弧形
        if (link._edgeHidden) return;
        // 弧形聚合 - 用 _curveOffset 实现多边不同弯曲度
        const src = typeof link.source === 'object' ? link.source : { x: 0, y: 0 };
        const tgt = typeof link.target === 'object' ? link.target : { x: 0, y: 0 };
        const style = EDGE_STYLES[link.type] || EDGE_DEFAULT;
        const mx = (src.x + tgt.x) / 2;
        const my = (src.y + tgt.y) / 2;
        const dx = tgt.x - src.x;
        const dy = tgt.y - src.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        // v37 彻底方案：距离自适应弧度（强弧 + 跨行业超弧 + 视觉弱化）
        let curvature, alpha = 1;
        if (dist < 60) {
          curvature = 0; alpha = 0.95;  // 短边：直线
        } else if (dist < 150) {
          curvature = 0.25; alpha = 0.7;  // 中边：明显弧 + 渐变
        } else if (dist < 400) {
          curvature = 0.5; alpha = 0.45;  // 长边：强弧 + 透明度弱
        } else {
          curvature = 0.85; alpha = 0.3;  // 跨行业超长：超弧 + 透明虚化
        }
        // 同对多边追加 _curveOffset 偏移，避免重叠
        const offset = dist * (curvature + (link._curveOffset || 0));
        const nx = -dy / dist * offset;
        const ny = dx / dist * offset;
        ctx.beginPath();
        ctx.moveTo(src.x, src.y);
        ctx.quadraticCurveTo(mx + nx, my + ny, tgt.x, tgt.y);
        ctx.strokeStyle = style.color.replace(/[\d.]+\)$/, '0.7)');
        ctx.lineWidth = style.width * 0.9;
        ctx.stroke();
      })
      // 方向 2: 箭头方向（按 edge.type 显示）
      .linkDirectionalArrowLength(link => {
        const style = EDGE_STYLES[link.type] || EDGE_DEFAULT;
        if (style.arrow === 'full') return 5;
        if (style.arrow === 'arrow') return 3;
        return 0;
      })
      .linkDirectionalArrowRelPos(link => {
        const style = EDGE_STYLES[link.type] || EDGE_DEFAULT;
        return style.arrow === 'full' ? 1 : 0.95;
      })
      .linkDirectionalParticles(link => (link.weight || 0.5) >= 0.7 ? 2 : 0)
      .linkDirectionalParticleSpeed(link => 0.005)
      // 方向 2: 边标签（关系类型）
      .linkLabel(link => {
        const style = EDGE_STYLES[link.type] || EDGE_DEFAULT;
        return (link.weight || 0.5) >= 0.7 ? style.label : '';
      })
      .linkCanvasObjectMode(link => 'after')
      .linkCanvasObject((link, ctx, globalScale) => {
        const style = EDGE_STYLES[link.type] || EDGE_DEFAULT;
        const w = link.weight || 0.5;
        // 只在强边 + zoom > 1.0 时显示标签
        if (w < 0.7 || globalScale < 1.0) return;
        if (style.dash) {
          ctx.setLineDash(style.dash.map(d => d / globalScale));
        } else {
          ctx.setLineDash([]);
        }
        // link 在 force-graph 中 source/target 是对象
        const src = typeof link.source === 'object' ? link.source : null;
        const tgt = typeof link.target === 'object' ? link.target : null;
        if (!src || !tgt || src.x === undefined || tgt.x === undefined) return;
        
        // 画边中点标签
        const mx = (src.x + tgt.x) / 2;
        const my = (src.y + tgt.y) / 2;
        const label = style.label;
        const fontSize = 9 / globalScale;
        ctx.font = `bold ${fontSize}px Sans-Serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const labelW = ctx.measureText(label).width;
        
        // 背景框
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(mx - labelW/2 - 2/globalScale, my - fontSize/2 - 1, labelW + 4/globalScale, fontSize + 2);
        // 边框（按边颜色）
        ctx.strokeStyle = style.color;
        ctx.lineWidth = 0.5 / globalScale;
        ctx.strokeRect(mx - labelW/2 - 2/globalScale, my - fontSize/2 - 1, labelW + 4/globalScale, fontSize + 2);
        // 文字
        ctx.fillStyle = '#fff';
        ctx.fillText(label, mx, my);
      })
      .linkDirectionalArrowColor(link => {
        const style = EDGE_STYLES[link.type] || EDGE_DEFAULT;
        return style.color;
      })
      // v29: 箭头显示（参考 Obsidian showArrow=true）—— 删除 L1008 把箭头全关掉的代码
      // 原 L950 已经根据 EDGE_STYLES.arrow 正确返回长度（full=5 / arrow=3 / none=0）
      .linkDirectionalArrowLength(link => {   // v29: 恢复箭头显示（之前被 L1008 误关为 0）
        const style = EDGE_STYLES[link.type] || EDGE_DEFAULT;
        if (style.arrow === 'full') return 6;     // v29: 5 → 6（线条粗 2.5x，箭头也加大）
        if (style.arrow === 'arrow') return 4;    // v29: 3 → 4
        return 0;
      })
      // B2 关键：让 force-graph 内部 d3-force 立即停止（alphaDecay 极大值）
      // 这样它的内部 d3-force 在 1 tick 内就停止，不会与我们的独立 d3-force 冲突
      .d3AlphaDecay(1)        // B2: 立即停止（默认 0.0228）
      .d3VelocityDecay(0.4)
      .warmupTicks(0)         // B2: 不要预热
      .onNodeClick(onNodeClick)
      .onNodeHover(onNodeHover)
      .onBackgroundClick(() => {
        if (selectedNode) {
          selectedNode = null;
          updateFocusDisplay();
        }
      });

    window.Graph = Graph  // 暴露给 window（测试 + 调试 + 外部控制用 - 必须在链式结束后）

    // ===========================
    // 方向 J: 行业聚类 HTML overlay（yFiles / FalkorDB 优秀实践）
    // ===========================
    function __renderIndustryHulls() {
      if (!graphData || !graphData.nodes || !graphData.nodes.length) return;
      const groups = {};
      graphData.nodes.forEach(n => {
        const ind = n.industry || 'unknown';
        if (!groups[ind]) groups[ind] = [];
        if (n.x !== undefined && n.y !== undefined) groups[ind].push({ x: n.x, y: n.y });
      });
      const hulls = [];
      for (const ind of Object.keys(groups)) {
        const pts = groups[ind];
        if (pts.length < 3) continue;
        const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
        const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
        const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
        hulls.push({ ind: ind, minX: minX, maxX: maxX, minY: minY, maxY: maxY, nodeCount: pts.length });
      }
      window.__industryHulls = hulls;
      console.log('[方向 J] 行业聚类已计算:', hulls.length, '个行业');
    }

    function __renderIndustryHullsOverlay() {
      const container = document.getElementById('industryHullsOverlay');
      if (!container || !window.__industryHulls) return;
      container.innerHTML = '';
      const focusInd = window.__dataFunnel && window.__dataFunnel.currentIndustry;
      if (!focusInd) return;
      const hulls = window.__industryHulls;
      const target = hulls.find(h => h.ind === focusInd);
      if (!target) return;
      if (!window.Graph || typeof window.Graph.graph2ScreenCoords !== 'function') return;
      const xy1 = window.Graph.graph2ScreenCoords(target.minX, target.minY);
      const xy2 = window.Graph.graph2ScreenCoords(target.maxX, target.maxY);
      const x1 = xy1[0], y1 = xy1[1], x2 = xy2[0], y2 = xy2[1];
      const left = Math.min(x1, x2), right = Math.max(x1, x2);
      const top = Math.min(y1, y2), bottom = Math.max(y1, y2);
      const div = document.createElement('div');
      div.className = 'industry-hull-tag';
      div.textContent = '📍 ' + target.ind + ' · ' + target.nodeCount + ' 节点';
      div.style.cssText = 'position: fixed; left: ' + left + 'px; top: ' + (top - 28) + 'px; background: rgba(78,201,255,0.2); border: 1px solid rgba(78,201,255,0.7); color: #4ec9ff; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; z-index: 50; backdrop-filter: blur(8px); box-shadow: 0 2px 8px rgba(78,201,255,0.4); pointer-events: none; white-space: nowrap;';
      container.appendChild(div);
    }

    setTimeout(function() { __renderIndustryHulls(); __renderIndustryHullsOverlay(); }, 6000);
    setInterval(function() { __renderIndustryHulls(); __renderIndustryHullsOverlay(); }, 3000);
    console.log('[方向 J] 行业聚类 overlay 函数已注册（v10 修复版）');

    // ===========================
    // 方向 N: Smart label placement (已在 nodeCanvasObject 中实现)
    // ===========================

    // ===========================
    // 方向 O: Cluster auto-grouping - 邻居相似度感知着色
    // ===========================
    function __applyClusterColoring() {
      if (!graphData || !graphData.nodes || !graphData.links) return;
      const neighborIndustry = {};
      graphData.nodes.forEach(function(n) { neighborIndustry[n.id] = {}; });
      graphData.links.forEach(function(l) {
        var s = typeof l.source === 'object' ? l.source.id : l.source;
        var t = typeof l.target === 'object' ? l.target.id : l.target;
        var sourceNode = graphData.nodes.find(function(n) { return n.id === s; });
        var targetNode = graphData.nodes.find(function(n) { return n.id === t; });
        if (sourceNode && targetNode) {
          var tInd = targetNode.industry || 'unknown';
          neighborIndustry[s][tInd] = (neighborIndustry[s][tInd] || 0) + 1;
        }
      });
      graphData.nodes.forEach(function(n) {

      // 数据源：data.json 中每个 entity 的 _logicRefs 字段（含 premise/conclusion/reasoning/dimension）
      function buildRealLogicContent(n) {
        const ctx = [];
        const logicRefs = n._logicRefs || [];

        if (logicRefs.length === 0) {
          // 无真实逻辑关联的节点：明确告知，避免假逻辑
          ctx.push({ stage: '说明', text: `该节点暂无来自知识图谱的真实逻辑链记录（仅基础描述与关系）。` });
          return ctx;
        }

        // P248 v7 (2026-08-13): 全部逻辑链展开，禁止截断
        // v6 只展 is_core 前 3 条 → 用户看到"后面只有名称没有介绍"
        // 修复: 全部 is_core 优先排前，非 core 排在后，全部展开
        const coreLogics = logicRefs.filter(l => l.is_core);
        const nonCore = logicRefs.filter(l => !l.is_core);
        const displayLogics = coreLogics.concat(nonCore);

        displayLogics.forEach((logic, idx) => {
          // 真实逻辑链：前提 → 推理 → 结论
          if (logic.premise) {
            ctx.push({
              stage: '前提',
              text: logic.premise,
              logicType: logic.logic_type,
              confidence: logic.confidence
            });
          }
          if (logic.intermediate) {
            ctx.push({
              stage: '推理',
              text: logic.intermediate
            });
          }
          if (logic.conclusion) {
            ctx.push({
              stage: '结论',
              text: logic.conclusion
            });
          }
          // 应用场景作为补充
          if (logic.apply_scenario) {
            ctx.push({
              stage: '场景',
              text: logic.apply_scenario
            });
          }
        });

        // 统计信息
        ctx.push({
          stage: '统计',
          text: `该节点共有 ${logicRefs.length} 条逻辑链记录（${displayLogics.length} 条已展开）`
        });

        return ctx;
      }
      // 逻辑链/框架渲染已合并到下方 v58 独立卡片（L2427-2470）
      // L2148-2151 旧调用删除：buildRealLogicContent 仅在 detailLogic 渲染时用一次

// v34: 按关系类别展示（重构 v33 5 维度）— 主公要求：竞争/对比/上下游/客户/产品/技术/供应/战略联盟
      // 实测：边 type 18 种（对比766/供应606/上下游566/监管487/合作397/竞争364/客户237/投资149/战略联盟133/技术链70...）
      // 上下游 vs 客户 vs 供应 是独立类型，不重复
      // 产品/技术 — 边无 type，产品用 n.type='PRODUCT'、技术用 n.type='TECH'
      // 逻辑 — 去掉描述 v33（之主公反馈“逻辑=公司简介”），改为从出边构建逻辑论述

      // 1. 按关系类别分组（从出边出发）
      const relationGroups = {
        '对比': [],
        '供应': [],
        '上下游': [],
        '竞争': [],
        '合作': [],
        '客户': [],
        '战略联盟': [],
        '投资': [],
        '监管': []
      };
      // 产品/技术 — 按节点 type 收集邻居中的 PRODUCT/TECH
      const productRelations = [];
      const techRelations = [];

      graphData.links.forEach(l => {
        const sId = typeof l.source === 'object' ? l.source.id : l.source;
        const tId = typeof l.target === 'object' ? l.target.id : l.target;
        if (sId !== node.id && tId !== node.id) return;
        const otherId = sId === node.id ? tId : sId;
        const other = graphData.nodes.find(nn => nn.id === otherId);
        if (!other) return;
        const t = l.type || '未标注';

        // 主公列出的 9 个关系类别（加上“合作”扩展）
        if (relationGroups[t]) {
          relationGroups[t].push({ node: other, edgeType: t, dir: sId === node.id ? 'out' : 'in' });
        }
        // 产品/技术 — 从邻居节点 type 收集
        if (other.type === 'PRODUCT') productRelations.push({ node: other, edgeType: t, dir: sId === node.id ? 'out' : 'in' });
        if (other.type === 'TECH') techRelations.push({ node: other, edgeType: t, dir: sId === node.id ? 'out' : 'in' });
      });

      // ── 去重：双向关系合并（如 英伟达→AMD 竞争 + AMD→英伟达 竞争 → 英伟达↔AMD 竞争）──
      Object.keys(relationGroups).forEach(key => {
        const list = relationGroups[key];
        const merged = [];
        const seen = new Map(); // neighborId → entry
        list.forEach(item => {
          const nid = item.node.id;
          if (seen.has(nid)) {
            const existing = seen.get(nid);
            // 已有记录，标记为双向
            if (existing.dir !== item.dir) {
              existing.dir = 'both';
            }
          } else {
            seen.set(nid, { ...item });
          }
        });
        relationGroups[key] = Array.from(seen.values());
      });
      // ── 去重2：PRODUCT/TECH 节点已在"产品/技术"分类展示，从其他分类移除 ──
      const productTechIds = new Set();
      productRelations.forEach(item => productTechIds.add(item.node.id));
      techRelations.forEach(item => productTechIds.add(item.node.id));
      Object.keys(relationGroups).forEach(key => {
        if (key === '产品' || key === '技术') return;
        relationGroups[key] = relationGroups[key].filter(item => !productTechIds.has(item.node.id));
      });

      // 2. 渲染：按主公要求顺序
      const relationOrder = [
        { key: '竞争', emoji: '🔴', color: '#FF6B6B', desc: '与该节点存在业务/市场竞争关系' },
        { key: '对比', emoji: '🔵', color: '#4EC9FF', desc: '可作为该节点的对比参照' },
        { key: '上下游', emoji: '🟣', color: '#C586C0', desc: '价值链上涻下游联动' },
        { key: '客户', emoji: '🟡', color: '#FFD700', desc: '该节点的客户/采购方' },
        { key: '供应', emoji: '🟢', color: '#B5CEA8', desc: '该节点的供应商/服务提供方' },
        { key: '产品', emoji: '⚡', color: '#FFA07A', desc: '相关产品（产品类邻居）', sourceKey: 'productRelations' },
        { key: '技术', emoji: '🔬', color: '#9CDCFE', desc: '相关技术（技术类邻居）', sourceKey: 'techRelations' },
        { key: '战略联盟', emoji: '🤝', color: '#C586C0', desc: '战略联盟/合作伙伴' },
        { key: '合作', emoji: '🤜', color: '#DDA0DD', desc: '一般合作关系' },
        { key: '投资', emoji: '💰', color: '#FFD700', desc: '投资/控股/子公司关系' }
      ];

      function renderRelationGroup(groupKey, emoji, color, desc, sourceKey) {
        const list = sourceKey === 'productRelations' ? productRelations :
                     sourceKey === 'techRelations' ? techRelations :
                     relationGroups[groupKey] || [];
        if (!list || list.length === 0) return '';

        const html = [`<div style="color:${color};font-weight:bold;margin:12px 0 6px;font-size:13px;">${emoji} ${escapeHtml(groupKey)} <span style="color:#888;font-weight:normal;">×${list.length}</span> <span style="color:#666;font-size:11px;font-weight:normal;">${escapeHtml(desc)}</span></div>`];

        // P248 (2026-08-13): 用户要求全部显示，去掉限制
        list.forEach(item => {
          const n = item.node;
          const dir = item.dir === 'out' ? '→' : item.dir === 'both' ? '↔' : '←';
          const nc = TYPE_COLORS[n.type] || '#888';
          const edgeTypeLabel = item.edgeType && item.edgeType !== groupKey ? `<span style="color:#666;font-size:11px;"> [${escapeHtml(item.edgeType)}]</span>` : '';
          html.push(`<div class="detail-relation-item" data-id="${escapeHtml(n.id)}" style="font-size:13px;color:#ccc;line-height:1.8;padding:5px 10px;cursor:pointer;border-left:3px solid ${color};margin:3px 0;border-radius:4px;background:rgba(255,255,255,0.02);" onmouseover="this.style.background='${color}25';this.style.paddingLeft='14px'" onmouseout="this.style.background='rgba(255,255,255,0.02)';this.style.paddingLeft='10px'">
            <span style="color:${nc}">●</span> ${dir} <b style="color:${color}">${escapeHtml((n.name||n.id).slice(0, 32))}</b><span style="color:#888;font-size:11px;"> [${escapeHtml(n.type || '?')}]</span>${edgeTypeLabel}
          </div>`);
        });

        // P248: 去掉"还有 N 个"折叠提示，全部显示
        return html.join('');
      }

      // P242 Fix (2026-08-12): 删除重复的逻辑链/框架渲染
      // 根因: 同一数据源 _logicRefs 和 _frameworks 在 detailRelated 内（v34+v44 旧逻辑）
      // 和独立卡片（detailLogic/detailFrameworks，v58）两处渲染 → 用户看到重复内容
      // 修复: 逻辑链只保留 detailLogic 独立卡片，框架只保留 detailFrameworks 独立卡片
      // 下面保留关系分组（v34 关系类别）+ 指标 + 关联实体

      // ====== P247 v4 (2026-08-12): 合并关系网络 + 关联实体（去重）======
      // 用户反馈: 关联指标和关联实体重复（同一实体在 关系网络 和 关联实体 各出现一次）
      // 修复: 以 _relatedEntities 为主（含 description），relationGroups 补充（无 description 的邻居）
      // 合并去重: 按 entityId 构建 Map，取描述最丰富版本
      const entityMap = new Map(); // entityId → { name, type, relations: Set, description, dir }
      // 1. 从 _relatedEntities 注入（优先级高，含 description）
      (node._relatedEntities || []).forEach(r => {
        const otherNode = graphData.nodes.find(nn => nn.id === r.other_id);
        const name = otherNode ? otherNode.name || otherNode.id : r.other_id;
        const key = r.other_id || name;
        if (!entityMap.has(key)) {
          entityMap.set(key, { id: r.other_id || name, name, type: otherNode?.type, relations: new Set(), description: '', dir: r.dir });
        }
        const entry = entityMap.get(key);
        entry.relations.add(r.relation_type || '相关');
        if (r.description && r.description.length > entry.description.length) entry.description = r.description;
        if (r.dir) entry.dir = r.dir;
      });
      // 2. 从 relationGroups 补充（无 description 的邻居）
      const getGroupItems = (sourceKey) => {
        if (sourceKey === 'productRelations') return productRelations;
        if (sourceKey === 'techRelations') return techRelations;
        return relationGroups[sourceKey] || [];
      };
      relationOrder.forEach(g => {
        getGroupItems(g.sourceKey || g.key).forEach(item => {
          const n = item.node;
          const key = n.id;
          if (!entityMap.has(key)) {
            // P248 v7: 取邻居节点的 description（graphData.nodes 自带 description），不再硬编码空
            const desc = n.description || n.desc || '';
            entityMap.set(key, { id: n.id, name: n.name || n.id, type: n.type, relations: new Set(), description: desc, dir: item.dir });
          }
          const entry = entityMap.get(key);
          entry.relations.add(item.edgeType || g.key);
          if (item.dir && !entry.dir) entry.dir = item.dir;
        });
      });
      // 3. 渲染合并且带跳转链接
      if (entityMap.size > 0) {
        // 按关系类型分组
        const relByType = {};
        entityMap.forEach((entry) => {
          entry.relations.forEach(rel => {
            if (!relByType[rel]) relByType[rel] = [];
            relByType[rel].push(entry);
          });
        });
        relatedHtml += '<div style="color:#FFA07A;font-weight:bold;margin:14px 0 6px;font-size:14px;">🔗 关联实体 <span style="color:#888;font-weight:normal;">×' + entityMap.size + '</span></div>';
        // 按常见关系类型排序
        const relOrder = ['竞争','对比','上下游','客户','供应','产品','技术','战略联盟','合作','投资','监管','相关'];
        Object.entries(relByType)
          .sort((a,b) => (relOrder.indexOf(a[0]) !== -1 ? relOrder.indexOf(a[0]) : 99) - (relOrder.indexOf(b[0]) !== -1 ? relOrder.indexOf(b[0]) : 99))
          .forEach(([rtype, list]) => {
          const dir = list[0] && list[0].dir === 'out' ? '→' : '←';
          const nc = list[0]?.type ? (TYPE_COLORS[list[0].type] || '#888') : '#888';
          relatedHtml += `<div style="color:${nc};font-size:11px;margin:6px 0 3px;font-weight:bold;">▸ ${dir} ${escapeHtml(rtype)}（${list.length}）</div>`;
          // P248: 全部显示，去掉"还有 N 个"折叠提示
          list.forEach(entry => {
            const desc = (entry.description || '').toString();
            const nc2 = entry.type ? (TYPE_COLORS[entry.type] || '#888') : '#888';
            relatedHtml += `<div class="detail-relation-item" data-id="${escapeHtml(entry.id)}" style="font-size:12px;color:#ccc;line-height:1.6;padding:4px 8px;margin:2px 0;border-left:2px solid ${nc2};background:rgba(255,160,122,0.04);cursor:pointer;">`;
            relatedHtml += `<b style="color:${nc2}">${escapeHtml(entry.name.slice(0, 24))}</b>`;
            if (desc) relatedHtml += `: ${escapeHtml(desc)}`;
            relatedHtml += `</div>`;
          });
          // P248: 去掉"还有 N 个"折叠提示，全部显示
          });
        // P248: 去掉"另有 N 个关系类型"提示，全部显示
      }
      // ====== v44 P0-1 : 关联指标（合并到关联实体下方）======
      const indicators = node._indicators || [];
      if (indicators.length > 0) {
        const indByType = {};
        indicators.forEach(ind => {
          const t = ind.indicator_type || '其他';
          if (!indByType[t]) indByType[t] = [];
          indByType[t].push(ind);
        });
        let indHtml = '';
        // P248: 全部类型 + 全部指标显示，并补上 value 数值
        Object.entries(indByType).forEach(([itype, list]) => {
          indHtml += `<div style="color:#9CDCFE;font-size:11px;margin:4px 0 2px;">▸ ${escapeHtml(itype)}（${list.length}）</div>`;
          list.forEach(ind => {
            const unit = ind.unit ? `<span style="color:#888;"> ${escapeHtml(ind.unit)}</span>` : '';
            const value = ind.value !== undefined && ind.value !== null && String(ind.value) !== '' ? `<span style="color:#B5CEA8;font-weight:bold;">=${escapeHtml(String(ind.value))}</span>` : '';
            const isCore = ind.is_core ? '⭐' : '·';
            indHtml += `<div style="font-size:12px;color:#ccc;line-height:1.6;padding:3px 8px;margin:2px 0;">${isCore} ${escapeHtml(ind.name.slice(0, 80))}${value}${unit}</div>`;
          });
        });
        if (indHtml) {
          relatedHtml += '<div style="color:#B5CEA8;font-weight:bold;margin:14px 0 6px;font-size:13px;">📊 关联指标 <span style="color:#888;font-weight:normal;">×' + indicators.length + '</span></div>';
          relatedHtml += indHtml;
        }
      }

      document.getElementById('detailRelated').innerHTML = relatedHtml;
      
      // 方向 M: 详情卡关联节点快速跳转 - event delegation（首次绑定）
      const detailRelated = document.getElementById('detailRelated');
      if (detailRelated && !detailRelated.dataset.bound) {
        detailRelated.dataset.bound = '1';
        detailRelated.style.cursor = 'pointer';
        detailRelated.addEventListener('click', (e) => {
          const li = e.target.closest('li[data-node-id]');
          if (!li || !window.Graph) return;
          const targetId = li.dataset.nodeId;
          const targetNode = (window.graphData?.nodes || []).find(n => n.id === targetId);
          if (targetNode && targetNode.x !== undefined) {
            window.Graph.centerAt(targetNode.x, targetNode.y, 600);
            if (window.Graph.zoom) window.Graph.zoom(2.5, 600);
            window.__showDetailCard(targetNode);
            console.log('[方向 M] 关联节点跳转:', targetNode.name);
          }
        });
        console.log('[方向 M] 详情卡关联跳转 event delegation 已绑定');
      }
      
// v33: 来源（填充真实可用的信息）— 报告来源：底 + 时间 + 社区 + 邻居样本报告
      // 实测：graphData.nodes 上 source_report_id 全为 null，但 industry/publishDate/_communityId 可用
      const sourceHtml = [];
      sourceHtml.push('<div style="color:#FFD700;font-weight:bold;margin:8px 0 4px;">📄 来源信息</div>');

      // 1. 所属行业（代表性来源）
      if (node.industry) {
        sourceHtml.push(`<div style="font-size:12px;color:#ccc;line-height:1.6;">所属行业: <b style="color:#9CDCFE">${escapeHtml(node.industry)}</b></div>`);
      }
      // 2. 子行业（更细粒度）
      if (node.subIndustry && node.subIndustry !== '未分类') {
        sourceHtml.push(`<div style="font-size:12px;color:#ccc;line-height:1.6;">子行业: <b>${escapeHtml(node.subIndustry)}</b></div>`);
      }
      // 3. 发布时间
      if (node.publishDate) {
        sourceHtml.push(`<div style="font-size:12px;color:#ccc;line-height:1.6;">发布时间: <b style="color:#B5CEA8">${escapeHtml(node.publishDate)}</b></div>`);
      }
      // 4. 社区（从哪里提取的限定）
      const cid = node._communityId !== undefined ? node._communityId : node.communityId;
      if (cid !== undefined && cid !== null && cid !== '未分配') {
        sourceHtml.push(`<div style="font-size:12px;color:#ccc;line-height:1.6;">社区编号: <b style="color:#C586C0">#${cid}</b> <span style="color:#888">(关联提取源)</span></div>`);
      }
      // 5. 邻居的行业多样性（当作验证该节点所属领域的互补指标）
      const neighborInds = new Set();
      const seenV33 = new Set();
      graphData.links.forEach(l => {
        const sId = typeof l.source === 'object' ? l.source.id : l.source;
        const tId = typeof l.target === 'object' ? l.target.id : l.target;
        let otherId = null;
        if (sId === node.id && tId !== node.id) otherId = tId;
        else if (tId === node.id && sId !== node.id) otherId = sId;
        if (otherId && !seenV33.has(otherId)) { seenV33.add(otherId); }
      });
      const neighborNodes = Array.from(seenV33).map(id => graphData.nodes.find(nn => nn.id === id)).filter(Boolean);
      neighborNodes.forEach(n => { if (n.industry) neighborInds.add(n.industry); });
      if (neighborInds.size > 0) {
        const sample = Array.from(neighborInds).slice(0, 4).join('、');
        sourceHtml.push(`<div style="font-size:12px;color:#ccc;line-height:1.6;">跨行业样本: <span style="color:#888">${escapeHtml(sample)}${neighborInds.size > 4 ? ` 等 ${neighborInds.size} 个` : ''}</span></div>`);
      }
      // 6. 总被引用次数（入度 + 出度）
      const indeg = seenV33.size;
      const sourceHtmlExtra = [];
      sourceHtmlExtra.push(`<div style="font-size:12px;color:#ccc;line-height:1.6;">关联边数: <b style="color:#FFA07A">${indeg}</b> <span style="color:#888">(入+出 = 跨领域影响)</span></div>`);

      // P221 (2026-07-28): 原始研报 — 从 node._reports 渲染可点击链接到 report-viewer
      const reports = node._reports || [];
      if (reports && reports.length > 0) {
        const rptHtml = ['<div style="color:#FFD700;font-weight:bold;margin:12px 0 4px;font-size:13px;">📄 原始研报 <span style="color:#888;font-weight:normal;">×</span>' + reports.length + '</div>'];
        // P248: 全部研报显示，去掉 8 条限制
        reports.forEach(rp => {
          const rid = rp.report_id || '';
          const title = rp.title || '(无标题)';
          const meta = [rp.source, rp.publish_date, rp.industry].filter(Boolean).join(' · ');
          if (rid) {
            rptHtml.push(
              '<div style="font-size:12px;line-height:1.5;color:#ccc;padding:4px 6px;margin:2px 0;">' +
                '<a href="./report-viewer.html?report_id=' + escapeHtml(rid) +
                '" target="_blank" rel="noopener" style="color:#4EC9FF;text-decoration:none;font-weight:500;">' +
                escapeHtml(title.slice(0, 80)) + (title.length > 80 ? '…' : '') + '</a>' +
                (meta ? '<div style="color:#888;font-size:11px;margin-top:2px;">' + escapeHtml(meta) + '</div>' : '') +
              '</div>'
            );
          } else {
            rptHtml.push(
              '<div style="font-size:12px;color:#888;padding:4px 6px;margin:2px 0;">' + escapeHtml(title.slice(0, 80)) + '</div>'
            );
          }
        });
        sourceHtmlExtra.push(rptHtml.join(''));
      } else {
        // P221 v2: 无报告时显式提示
        sourceHtmlExtra.push('<div style="font-size:11px;color:#888;margin:12px 0 4px;">📄 暂无关联研报</div>');
      }

      // 合并 + 输出
      document.getElementById('detailSources').innerHTML = (sourceHtml.concat(sourceHtmlExtra)).join('') || '<div style="color:#888">无引用来源</div>';

      // ===== v58 逻辑链（替换 v34 假逻辑）=====
      try {
        if (typeof buildRealLogicContent === 'function') {
          const logics = buildRealLogicContent(node);
          let logicHtml = '';
          if (logics.length === 0) {
            logicHtml = '<div style="font-size:11px;color:#888;margin:12px 0 4px;">🔗 暂无关联逻辑链</div>';
          } else {
            // P248: 全部逻辑链 + 全部文本显示，去掉截断
            logics.forEach(l => {

    setTimeout(() => {

      const my = (e.clientY - rect.top) / rect.height;
      if (!graphData?.nodes?.length) return;
      const xs = graphData.nodes.map(n => n.x || 0);
      const ys = graphData.nodes.map(n => n.y || 0);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const rangeX = Math.max(maxX - minX, 1);
      const rangeY = Math.max(maxY - minY, 1);
      const padding = 10;
      const worldX = minX + ((mx * miniMap.width - padding) / (miniMap.width - padding * 2)) * rangeX;
      const worldY = minY + ((my * miniMap.height - padding) / (miniMap.height - padding * 2)) * rangeY;
      if (window.Graph?.centerAt) {

      ctx.fillRect(0, 0, miniMap.width, miniMap.height);
      
      // 计算 bbox
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      graphData.nodes.forEach(n => {
        if (n.x !== undefined) {
          minX = Math.min(minX, n.x);
          maxX = Math.max(maxX, n.x);
          minY = Math.min(minY, n.y);
          maxY = Math.max(maxY, n.y);
        }
      });
      if (minX === Infinity) return;
      const rangeX = maxX - minX || 1;
      const rangeY = maxY - minY || 1;
      const padding = 10;
      
      // 画节点（缩略点）
      graphData.nodes.forEach(n => {

        const px = ((n.x - minX) / rangeX) * (miniMap.width - padding * 2) + padding;
        const py = ((n.y - minY) / rangeY) * (miniMap.height - padding * 2) + padding;
        const typeColor = TYPE_COLORS[n.type] || '#888';
        ctx.fillStyle = typeColor;
        ctx.beginPath();
        ctx.arc(px, py, n.importance === 3 ? 3 : 1.5, 0, Math.PI * 2);
        ctx.fill();
      });

        const viewportH = dist * 0.9;

        const cy = ((cam.y - minY) / rangeY) * (miniMap.height - padding * 2) + padding;
        const vw = Math.min(viewportW / rangeX * miniMap.width, miniMap.width - padding * 2);
        const vh = Math.min(viewportH / rangeY * miniMap.height, miniMap.height - padding * 2);
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx - vw/2, cy - vh/2, vw, vh);
      } catch (e) {}
    };

  // ===========================
  // P2.1: 搜索功能
  // ===========================
  let __searchHighlighted = null;
  function setupSearch() {
    const input = document.getElementById('searchInput');
    const resultsDiv = document.getElementById('searchResults');
    if (!input || !resultsDiv) return;
    
    input.addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      if (!query) {
        resultsDiv.innerHTML = '';
        resultsDiv.style.display = 'none';
        if (__searchHighlighted) {
          __searchHighlighted.forEach(n => n._searched = false);
          __searchHighlighted = null;
        }
        return;
      }
      
      const matches = graphData.nodes.filter(n => {
        return (n.name || '').toLowerCase().includes(query) ||
               (n.type || '').toLowerCase().includes(query) ||
               (n.industry || '').toLowerCase().includes(query);
      }).slice(0, 20);
      
      if (__searchHighlighted) {
        __searchHighlighted.forEach(n => n._searched = false);
      }
      matches.forEach(n => n._searched = true);
      __searchHighlighted = matches;
      
      resultsDiv.style.display = 'block';
      resultsDiv.innerHTML = matches.length === 0 
        ? '<div class="search-empty">无匹配节点</div>'
        : matches.map(n => {
          const typeColor = TYPE_COLORS[n.type] || '#888';
          return `<div class="search-item" data-id="${n.id}">
            <span style="color:${typeColor}">●</span>
            <span class="search-name">${escapeHtml(n.name || n.id)}</span>
            <span class="search-meta">${escapeHtml(n.typeLabel || n.type || '')} · ${escapeHtml(n.industry || '')}</span>
          </div>`;
        }).join('');
      
      resultsDiv.querySelectorAll('.search-item').forEach(el => {
        el.addEventListener('click', () => {
          const nodeId = el.dataset.id;
          const node = graphData.nodes.find(n => n.id === nodeId);
          if (node && Graph) {
            // 方向 7: 智能层级展开 - 根据搜索结果类型自动展开到合适层级
            // L0 → L1 → L2 → L3 → L4
            const funnel = window.__dataFunnel;
            if (funnel.level === 'L0' && node.industry) {
              funnel.level = 'L1';
              funnel.currentIndustry = node.industry;
              window.__applyDataFunnel();
            } else if (funnel.level === 'L1') {
              funnel.level = 'L2';
              funnel.currentType = node.type;
              window.__applyDataFunnel();
            }
            // L2/L3/L4 直接跳到节点详情
            funnel.level = 'L4';
            funnel.currentNode = node.id;
            window.__applyDataFunnel();
            
            // 等动画完成后定位
            setTimeout(() => {
              if (node.x !== undefined) {
                Graph.centerAt(node.x, node.y, 800);
                Graph.zoom(3, 800);
              }
              // 方向 5: 自动弹出详情卡
              if (typeof window.__showDetailCard === 'function') {
                window.__showDetailCard(node);
              }
            }, 500);
            
            input.value = '';
            resultsDiv.style.display = 'none';
            if (__searchHighlighted) {
              __searchHighlighted.forEach(n => n._searched = false);
              __searchHighlighted = null;
            }
            console.log('[方向 7] 搜索智能展开:', node.name, '→ L4 详情');
          }
        });
      });
    });
    
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        input.value = '';
        resultsDiv.style.display = 'none';
        if (__searchHighlighted) {
          __searchHighlighted.forEach(n => n._searched = false);
          __searchHighlighted = null;
        }
      }
    });
  }

  // ===========================
  // P2.3: 右键菜单
  // ===========================
  let __contextNode = null;
  function setupContextMenu() {
    const menu = document.getElementById('contextMenu');
    if (!menu || !Graph) return;
    
    Graph.onNodeRightClick(node => {
      if (!node) return;
      __contextNode = node;
      menu.style.display = 'block';
      menu.style.left = event.clientX + 'px';
      menu.style.top = event.clientY + 'px';
    });
    
    document.addEventListener('click', () => {
      menu.style.display = 'none';
    });
    
    menu.addEventListener('click', (e) => {
      const action = e.target.dataset.action;
      if (!action || !__contextNode) return;
      
      if (action === 'focus') {
        Graph.centerAt(__contextNode.x, __contextNode.y, 800);
        Graph.zoom(3, 800);
      } else if (action === 'hide') {
        __contextNode._hidden = true;
        (Graph.refresh ? Graph.refresh() : Graph._rerender ? Graph._rerender() : null);
      } else if (action === 'hideNeighbors') {
        const neighborIds = new Set([__contextNode.id]);
        graphData.links.forEach(l => {
          const src = typeof l.source === 'object' ? l.source.id : l.source;
          const tgt = typeof l.target === 'object' ? l.target.id : l.target;
          if (src === __contextNode.id) neighborIds.add(tgt);
          if (tgt === __contextNode.id) neighborIds.add(src);
        });
        graphData.nodes.forEach(n => {
          if (neighborIds.has(n.id)) n._hidden = true;
        });
        (Graph.refresh ? Graph.refresh() : Graph._rerender ? Graph._rerender() : null);
      } else if (action === 'showOnly') {
        const neighborIds = new Set([__contextNode.id]);
        graphData.links.forEach(l => {
          const src = typeof l.source === 'object' ? l.source.id : l.source;
          const tgt = typeof l.target === 'object' ? l.target.id : l.target;
          if (src === __contextNode.id) neighborIds.add(tgt);
          if (tgt === __contextNode.id) neighborIds.add(src);
        });
        graphData.nodes.forEach(n => {
          n._hidden = !neighborIds.has(n.id);
        });
        (Graph.refresh ? Graph.refresh() : Graph._rerender ? Graph._rerender() : null);
      } else if (action === 'copy') {
        navigator.clipboard.writeText(__contextNode.name || __contextNode.id);
      }
      
      menu.style.display = 'none';
    });
  }

  // ===========================
  // P3.4: hover 高亮 1-hop 邻居
  // ===========================
  let __hoveredNode = null;
  let __hoverNeighbors = new Set();
  function setupNeighborHighlight() {
    if (!Graph) return;
    
    Graph.onNodeHover(node => {
      __hoveredNode = node;
      
      __hoverNeighbors.clear();
      if (node) {
        __hoverNeighbors.add(node.id);
        graphData.links.forEach(l => {
          const src = typeof l.source === 'object' ? l.source.id : l.source;
          const tgt = typeof l.target === 'object' ? l.target.id : l.target;
          if (src === node.id) __hoverNeighbors.add(tgt);
          if (tgt === node.id) __hoverNeighbors.add(src);
        });
      }
      
      graphData.nodes.forEach(n => {
        n._highlighted = node ? __hoverNeighbors.has(n.id) : true;
        n._dimmed = node && !__hoverNeighbors.has(n.id);
      });
      
      graphData.links.forEach(l => {
        const src = typeof l.source === 'object' ? l.source.id : l.source;
        const tgt = typeof l.target === 'object' ? l.target.id : l.target;
        l._highlighted = node ? (src === node.id || tgt === node.id) : true;
        // P247 v5 (2026-08-12): 节点未选中/hover 时隐藏关系线条
        // 优先级: selectedNode（持久状态）> hover（临时）> 全部隐藏
        const activeNode = selectedNode || node;
        l._edgeHidden = activeNode ? !(src === activeNode.id || tgt === activeNode.id) : true;
      });
      
      (Graph.refresh ? Graph.refresh() : Graph._rerender ? Graph._rerender() : null);
    });
  }

    selectedNode = node;
    // v21 修复 Bug 16：点击节点时显示详情卡片
    if (typeof window.__showDetailCard === 'function') {
      window.__showDetailCard(node);
    }
    // P247 v5 (2026-08-12): 点击节点后保持关联边可见（手动更新 _edgeHidden）
    // 否则 force-graph 在 detailCard 打开后不触发 hover → 所有边被隐藏
    // 注意: 不再在这里调用 focusIndustry，避免干扰视图（原代码的 if/else 保留）
    // 仅设置 window.__postFocusNode 作为标记，让 focusIndustry 内部感知
    if (node.industry && node.industry !== currentFocus) {
      // 给 focusIndustry 注入目标节点 id，让它在重绘时直接设 _edgeHidden
      window.__postFocusNode = node;
      focusIndustry(node.industry);
      window.__postFocusNode = null;
    } else {
      updateFocusDisplay();
      // 同行业内点击：触发一次 hover 空事件以刷新 _edgeHidden（只显示 selectedNode 的边）
      try { Graph.onNodeHover && Graph.onNodeHover(null); } catch(e) {}

  function onNodeHover(node) {

    }

    if (canvas) canvas.style.cursor = node ? 'pointer' : 'default';
